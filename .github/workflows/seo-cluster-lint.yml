name: SEO Cluster Integrity

# P1: uses the shared setup-node-bun composite action for a single toolchain
# source (Node 22 + Bun + cached, frozen-lockfile install).

on:
  push:
    branches: [main, staging]
  pull_request:
    paths:
      - "src/routes/**"
      - "src/lib/seo/**"
      - "src/components/site/RelatedCluster.tsx"
      - "src/components/site/HubLongform.tsx"
      - "scripts/lint-seo-clusters.ts"
      - ".github/workflows/seo-cluster-lint.yml"

jobs:
  lint-seo-graph:
    name: Topic-cluster graph integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain (Node 22 + Bun, frozen install)
        uses: ./.github/actions/setup-node-bun

      - name: Lint SEO topic graph
        run: bun run lint:seo-orphans
