name: Restart Passenger Node App (correct app-root marker)

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Touch Passenger restart at served app root + verify health
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          PARENT=$(dirname "$DEPLOY_DIR")
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            echo '=== current release ==='
            readlink -f \"$DEPLOY_DIR/current\"
            echo '=== served app root (public_html/higaet.com) ==='
            readlink -f \"$PARENT/public_html/higaet.com\" 2>/dev/null || echo no-php-ht
            echo '=== passnger app-root candidates — touch restart markers in ALL ==='
            for d in \"$PARENT/public_html/higaet.com\" \"$DEPLOY_DIR/current\" \"$DEPLOY_DIR\"; do
              if [ -d \"\$d/tmp\" ]; then
                touch \"\$d/tmp/restart.txt\"
                echo \"touched \$d/tmp/restart.txt\"
              else
                mkdir -p \"\$d/tmp\" && touch \"\$d/tmp/restart.txt\"
                echo \"created+touched \$d/tmp/restart.txt\"
              fi
            done
            echo '=== .env present in served app root ==='
            ls -la \"$PARENT/public_html/higaet.com/.env\" 2>/dev/null || echo NO_ENV_IN_SERVED
            echo '=== app.js present ==='
            ls -la \"$PARENT/public_html/higaet.com/app.js\" 2>/dev/null || echo NO_APPJS
            echo '=== node version wrapper ==='
            ls -la /home/*/nodevenv/higaet.com/22/bin/node 2>/dev/null && echo NODE22_OK
          "
          echo '=== wait + verify ==='
          sleep 20
          for i in 1 2 3 4 5 6 7 8; do
            H=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 'https://www.higaet.com/healthz')
            echo "healthz=\$H attempt \$i"
            [ "$H" = "200" ] && break
            sleep 12
          done
          echo '=== final ==='
          curl -s -o /dev/null -w 'healthz=%{http_code}\n' --max-time 10 'https://www.higaet.com/healthz'
          curl -s -o /dev/null -w 'readyz=%{http_code}\n' --max-time 10 'https://www.higaet.com/readyz'
          curl -s -o /dev/null -w 'root=%{http_code}\n' --max-time 12 'https://www.higaet.com/'
          curl -s -o /dev/null -w 'academy=%{http_code}\n' --max-time 15 'https://www.higaet.com/academy'
          curl -s -o /dev/null -w 'old CkNBjbAm=%{http_code}\n' --max-time 12 'https://www.higaet.com/assets/academy.index-CkNBjbAm.js'
          curl -s -o /dev/null -w 'new CYZ_IBTj=%{http_code}\n' --max-time 12 'https://www.higaet.com/assets/academy.index-CYZ_IBTj.js'