name: Dependency Vulnerability Audit

# Thin wrapper — delegates to _security-kernel.yml.
# Runs on lockfile changes, weekly schedule, and manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "bun.lock"
      - ".github/workflows/dependency-audit.yml"
      - ".github/workflows/_security-kernel.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lockb"
      - "bun.lock"
      - ".github/workflows/dependency-audit.yml"
      - ".github/workflows/_security-kernel.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/_security-kernel.yml
    with:
      run-dependency-audit: true
      run-license-audit: false
      severity-threshold: "high"
    secrets: inherit
