name: Launch Readiness (Audit + E2E)

# Phase A security audit (static) + Phase C Playwright E2E with seeded users.
# Treat as the gate for Milestone 2 sign-off.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/**"
      - "scripts/security-audit.mjs"
      - "scripts/seed-test-users.mjs"
      - "scripts/generate-readiness-report.mjs"
      - "scripts/predeploy-schema-validation.ts"
      - "scripts/notify-failure.mjs"
      - "tests/e2e/**"
      - "tests/integration/**"
      - "playwright.config.ts"
      - ".github/workflows/launch-readiness.yml"

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
  GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"
      - name: Phase A — static security audit (STRICT)
        env:
          STRICT: "1"
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
        run: node scripts/security-audit.mjs
      - name: Predeploy schema validation
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
        run: npx tsx scripts/predeploy-schema-validation.ts
      - name: Permission validation (code-only)
        run: node tests/integration/permission-validation.test.mjs
      - name: Role validation (code vs DB)
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
        run: node tests/integration/role-validation.test.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          retention-days: 30
          path: |
            docs/infrastructure/security-audit-report.md
            docs/infrastructure/rls-route-consistency-report.md
            artifacts/schema-validation.json
      - name: Notify on failure
        if: failure()
        env:
          PAYLOAD_FILE: /tmp/notify-payload.json
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > "$PAYLOAD_FILE" <<EOF
          {
            "environment": "${{ github.event_name == 'pull_request' && 'preview' || 'ci' }}",
            "branch": "${{ github.ref_name }}",
            "commitSha": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "job": "security-audit",
            "failedAt": "$(date -u +%FT%TZ)",
            "runUrl": "$RUN_URL",
            "artifacts": [
              { "name": "audit + schema validation", "url": "$RUN_URL" }
            ]
          }
          EOF
          node scripts/notify-failure.mjs || true

  # Canonical build for the E2E preview server. All rebuilds must live in
  # the kernel (Build-Once). Emits a `launch-readiness-build` artifact
  # containing dist/, .output/, and release manifests.
  build:
    needs: security-audit
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      mode: core
      run-lint: false
      run-typecheck: false
      run-build: true
      upload-artifact: true
      artifact-name: launch-readiness-build
    secrets: inherit

  e2e:
    runs-on: ubuntu-latest
    needs: [security-audit, build]
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Seed test users (dev backend)
        env:
          ENVIRONMENT: staging
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_FIXTURE_PASSWORD: ${{ secrets.TEST_FIXTURE_PASSWORD }}
        run: node scripts/seed-test-users.mjs
      - name: Download kernel build artifact
        uses: actions/download-artifact@v4
        with:
          name: launch-readiness-build
          path: .
      - name: Verify downloaded artifact
        run: |
          set -e
          if [ ! -d dist ] && [ ! -d .output ]; then
            echo "::error::Downloaded artifact missing both dist/ and .output/"
            exit 1
          fi
          echo "artifact OK (dist=$( [ -d dist ] && echo y || echo n ), .output=$( [ -d .output ] && echo y || echo n ))"
      - name: Start preview server from downloaded artifact
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # `npm run preview` serves the already-built output. We must NOT
          # rebuild here — the kernel artifact above is the single source
          # of truth (Build-Once contract enforced by ci-integrity-guard.yml).
          npm run preview --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 && break
            sleep 2
          done

      - name: Phase C — Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          TEST_FIXTURE_PASSWORD: ${{ secrets.TEST_FIXTURE_PASSWORD }}
        run: npx playwright test
      - name: RLS integration matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_FIXTURE_PASSWORD: ${{ secrets.TEST_FIXTURE_PASSWORD }}
        run: node tests/integration/rls-matrix.test.mjs
      - name: Generate launch-readiness report
        if: always()
        run: node scripts/generate-readiness-report.mjs || true
      - name: Upload Playwright + readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-${{ github.run_id }}
          retention-days: 30
          path: |
            playwright-report/**
            playwright-results.json
            docs/testing/launch-readiness-report.md
            artifacts/schema-validation.json
      - name: Ingest readiness summary
        if: always()
        env:
          INGEST_URL: ${{ secrets.LAUNCH_READINESS_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.LAUNCH_READINESS_INGEST_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Ingest URL or secret not configured — skipping"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PW_PASSED=$(jq '[.suites[].specs[].tests[].results[] | select(.status=="passed")] | length' playwright-results.json 2>/dev/null || echo 0)
          PW_FAILED=$(jq '[.suites[].specs[].tests[].results[] | select(.status=="failed")] | length' playwright-results.json 2>/dev/null || echo 0)
          PW_SKIPPED=$(jq '[.suites[].specs[].tests[].results[] | select(.status=="skipped")] | length' playwright-results.json 2>/dev/null || echo 0)
          PW_DURATION=$(jq '.stats.duration // 0' playwright-results.json 2>/dev/null || echo 0)
          SCHEMA_STATUS=$(jq -r '.status // "unknown"' artifacts/schema-validation.json 2>/dev/null || echo unknown)
          SCHEMA_DETAILS=$(cat artifacts/schema-validation.json 2>/dev/null || echo '{}')
          OVERALL=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          PAYLOAD=$(jq -n \
            --arg sha "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg env "ci" \
            --arg run "${{ github.run_id }}" \
            --arg url "$RUN_URL" \
            --argjson pwp "$PW_PASSED" \
            --argjson pwf "$PW_FAILED" \
            --argjson pws "$PW_SKIPPED" \
            --argjson pwd "$PW_DURATION" \
            --arg schema "$SCHEMA_STATUS" \
            --argjson schemaD "$SCHEMA_DETAILS" \
            --arg overall "$OVERALL" \
            '{
              commit_sha:$sha, branch:$branch, environment:$env, workflow_run_id:$run,
              audit_errors:0, audit_warnings:0, audit_breakdown:{},
              playwright_passed:$pwp, playwright_failed:$pwf, playwright_skipped:$pws,
              playwright_duration_ms:$pwd,
              security_passed:0, security_failed:0,
              schema_validation_status:$schema, schema_validation_details:$schemaD,
              overall_status:$overall,
              artifact_urls:{ workflowRun:$url, playwrightReport:$url, schemaValidation:$url }
            }')
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$INGEST_SECRET" | awk '{print $2}')
          curl -fsS -X POST "$INGEST_URL" \
            -H "content-type: application/json" \
            -H "x-signature: $SIG" \
            --data "$PAYLOAD"
      - name: Notify on failure
        if: failure()
        env:
          PAYLOAD_FILE: /tmp/notify-payload.json
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > "$PAYLOAD_FILE" <<EOF
          {
            "environment": "ci",
            "branch": "${{ github.ref_name }}",
            "commitSha": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "job": "e2e",
            "failedAt": "$(date -u +%FT%TZ)",
            "runUrl": "$RUN_URL",
            "artifacts": [
              { "name": "Playwright report", "url": "$RUN_URL" },
              { "name": "Schema validation", "url": "$RUN_URL" }
            ]
          }
          EOF
          node scripts/notify-failure.mjs || true
