name: Staging Readiness Check (Phase 2.2-A)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: staging
      environment:
        required: false
        type: string
        default: staging
    secrets:
      STAGING_HOST:
        required: true
      STAGING_BASE_URL:
        required: true
      STAGING_EXPECTED_IP:
        required: false
      SSH_KEY:
        required: false
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_PORT:
        required: false
      DD_API_KEY:
        required: false
      DD_APP_KEY:
        required: false

concurrency:
  group: staging-readiness-history
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    outputs:
      status: ${{ steps.check.outputs.status }}
      transitioned: ${{ steps.check.outputs.transitioned }}
      prior_status: ${{ steps.check.outputs.prior_status }}

    steps:
      - uses: actions/checkout@v4

      - name: Workflow context
        run: |
          echo "::group::Workflow context"
          echo "workflow=${{ github.workflow }}"
          echo "repo=${{ github.repository }}"
          echo "run=${{ github.run_id }}"
          echo "::endgroup::"

      # -------------------------
      # PRECHECK (SAFE)
      # -------------------------
      - name: Preflight validation
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}
        run: |
          missing=0

          check() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing: $name"
              missing=$((missing+1))
            fi
          }

          check "STAGING_HOST" "$STAGING_HOST"
          check "STAGING_BASE_URL" "$STAGING_BASE_URL"
          check "STAGING_EXPECTED_IP" "$STAGING_EXPECTED_IP"

          if [ "$missing" -gt 0 ]; then
            echo "::error::Missing required config"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system deps
        run: sudo apt-get update -y && sudo apt-get install -y dnsutils openssl openssh-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # -------------------------
      # SSH SETUP (FIXED SAFE)
      # -------------------------
      - name: Write SSH key (if provided)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "No SSH key provided — skipping"
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # -------------------------
      # MAIN CHECKER
      # -------------------------
      - name: Run readiness checker
        id: check
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}

          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

          # FIX: real file path (NOT secret content)
          SSH_KEY_PATH: /home/runner/.ssh/id_ed25519

          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.READINESS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: bun scripts/check-staging-readiness.ts

      # -------------------------
      # DATADOG (NON-BLOCKING FIX)
      # -------------------------
      - name: Run Datadog Synthetic tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
            echo "Datadog keys missing — skipping safely"
            exit 0
          fi

          npx --yes @datadog/datadog-ci synthetics run-tests || {
            echo "::warning::Datadog Synthetic tests failed — not blocking readiness"
            exit 0
          }

      # -------------------------
      # ARTIFACTS
      # -------------------------
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}
          path: |
            test-results/readiness/**
            docs/infrastructure/**

      # -------------------------
      # COMMIT REPORT
      # -------------------------
      - name: Commit report
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "higaet-readiness-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/infrastructure/ || true

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(readiness): update report [skip ci]"
          git push || true

      # -------------------------
      # NOTIFICATION
      # -------------------------
      - name: Post transition issue
        if: steps.check.outputs.transitioned == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `STAGING READY — ${context.runId}`,
              body: "Readiness checks passed.",
              labels: ["readiness"]
            });
