name: Staging Readiness Check (Phase 2.2-A)

# Probes DNS / SSL / SSH / GitHub / deploy-target for staging.higaet.com,
# regenerates docs/infrastructure/phase-2-2-prerequisite-report.md, appends
# a row to staging-readiness-history.md, publishes a GitHub Actions Job
# Summary, and on the FAIL→PASS transition files an issue notification.
# Safe to run before any infrastructure exists. Does NOT deploy.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

concurrency:
  # Single writer for staging-readiness-history.md — queue updates, never cancel.
  group: staging-readiness-history
  cancel-in-progress: false

permissions:
  contents: write          # commit updated report + history
  issues: write            # post transition notification
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      status: ${{ steps.check.outputs.status }}
      transitioned: ${{ steps.check.outputs.transitioned }}
      prior_status: ${{ steps.check.outputs.prior_status }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install OpenSSL + dig
        run: sudo apt-get update -y && sudo apt-get install -y dnsutils openssl openssh-client

      - name: Install
        run: bun install --frozen-lockfile

      - name: Write SSH key (if provided)
        if: ${{ secrets.SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run readiness checker
        id: check
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_PATH: ${{ secrets.SSH_KEY != '' && '/home/runner/.ssh/id_ed25519' || '' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/apps/higaet' }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.READINESS_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun scripts/check-staging-readiness.ts

      - name: Validate deep links
        if: always()
        run: |
          OK="${{ steps.check.outputs.deep_links_ok }}"
          echo "deep_links_ok=$OK"
          if [ "$OK" != "true" ]; then
            echo "::warning::Deep-link validation reported issues — see test-results/readiness/*/deep-link-validation.json"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}
          path: |
            test-results/readiness/**
            docs/infrastructure/phase-2-2-prerequisite-report.md
            docs/infrastructure/staging-readiness-history.md

      - name: Commit updated report + history (retry with rebase)
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "higaet-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/infrastructure/phase-2-2-prerequisite-report.md docs/infrastructure/staging-readiness-history.md || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(readiness): update prerequisite report + history [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push failed on attempt $attempt — rebasing"
            git pull --rebase --autostash || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::warning::history push failed after 5 attempts — artifact still uploaded"

      - name: Post FAIL→PASS transition notification (GitHub Issue)
        if: steps.check.outputs.transitioned == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## STAGING READY",
              "",
              "All readiness checks passed.",
              "",
              `- Run: ${runUrl}`,
              `- Prior status: ${{ steps.check.outputs.prior_status }}`,
              `- Artifact: ${runUrl}#artifacts`,
              `- Report: ${{ steps.check.outputs.report_url }}`,
              "",
              "Phase 2.2 Authorization may now proceed.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `STAGING READY — readiness run ${context.runId}`,
              body,
              labels: ["readiness", "phase-2.2"],
            });

      - name: Optional Slack notification on FAIL→PASS
        if: steps.check.outputs.transitioned == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ steps.check.outputs.run_url }}
          REPORT_URL: ${{ steps.check.outputs.report_url }}
          ARTIFACT_URL: ${{ steps.check.outputs.artifact_url }}
        run: |
          payload=$(cat <<EOF
          {"text":"*STAGING READY* — readiness transitioned to GO\n• Time: $(date -u +%FT%TZ)\n• Run: ${RUN_URL}\n• Report: ${REPORT_URL}\n• Evidence: ${ARTIFACT_URL}"}
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || echo "::warning::Slack notification failed"

      - name: Fail job on NO-GO
        if: steps.check.outcome != 'success'
        run: |
          echo "::error::Staging prerequisites failed — see phase-2-2-prerequisite-report.md"
          echo "Report: ${{ steps.check.outputs.report_url }}"
          echo "Artifact: ${{ steps.check.outputs.artifact_url }}"
          exit 1
