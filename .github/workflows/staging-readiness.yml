name: Staging Readiness Check (Phase 2.2-A)

# Probes DNS / SSL / SSH / GitHub / deploy-target for staging.higaet.com,
# regenerates docs/infrastructure/phase-2-2-prerequisite-report.md, appends
# a row to staging-readiness-history.md, publishes a GitHub Actions Job
# Summary, and on the FAIL→PASS transition files an issue notification.
# Safe to run before any infrastructure exists. Does NOT deploy.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: staging-readiness
  cancel-in-progress: true

permissions:
  contents: write          # commit updated report + history
  issues: write            # post transition notification
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      status: ${{ steps.check.outputs.status }}
      transitioned: ${{ steps.check.outputs.transitioned }}
      prior_status: ${{ steps.check.outputs.prior_status }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install OpenSSL + dig
        run: sudo apt-get update -y && sudo apt-get install -y dnsutils openssl openssh-client

      - name: Install
        run: bun install --frozen-lockfile

      - name: Write SSH key (if provided)
        if: ${{ secrets.SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run readiness checker
        id: check
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_PATH: ${{ secrets.SSH_KEY != '' && '/home/runner/.ssh/id_ed25519' || '' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/apps/higaet' }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.READINESS_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun scripts/check-staging-readiness.ts

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}
          path: |
            test-results/readiness/**
            docs/infrastructure/phase-2-2-prerequisite-report.md
            docs/infrastructure/staging-readiness-history.md

      - name: Commit updated report + history
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "higaet-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/infrastructure/phase-2-2-prerequisite-report.md docs/infrastructure/staging-readiness-history.md || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(readiness): update prerequisite report + history [skip ci]"
            git push || echo "push failed (likely branch protection) — artifact still uploaded"
          fi

      - name: Post FAIL→PASS transition notification
        if: steps.check.outputs.transitioned == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## STAGING READY",
              "",
              "All readiness checks passed.",
              "",
              `- Run: ${runUrl}`,
              `- Prior status: ${{ steps.check.outputs.prior_status }}`,
              "- Evidence: see workflow artifact `readiness-${{ github.run_id }}`",
              "- Report: `docs/infrastructure/phase-2-2-prerequisite-report.md`",
              "",
              "Phase 2.2 Authorization may now proceed.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `STAGING READY — readiness run ${context.runId}`,
              body,
              labels: ["readiness", "phase-2.2"],
            });

      - name: Fail job on NO-GO
        if: steps.check.outcome != 'success'
        run: |
          echo "::error::Staging prerequisites failed — see phase-2-2-prerequisite-report.md"
          exit 1
