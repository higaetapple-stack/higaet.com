name: Staging Readiness Check (Phase 2.2-A)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

  # ✅ FIX: enables reusable workflow calls from authorization gate
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: staging
    secrets:
      STAGING_HOST:
        required: true
      STAGING_BASE_URL:
        required: true
      STAGING_EXPECTED_IP:
        required: false
      SSH_KEY:
        required: false
      SSH_HOST:
        required: false
      SSH_USER:
        required: false

concurrency:
  group: staging-readiness-history
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: staging

    outputs:
      status: ${{ steps.check.outputs.status }}
      transitioned: ${{ steps.check.outputs.transitioned }}
      prior_status: ${{ steps.check.outputs.prior_status }}

    steps:
      - uses: actions/checkout@v4

      - name: Workflow context
        run: |
          echo "::group::Workflow context"
          echo "workflow=${{ github.workflow }}"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "run_id=${{ github.run_id }}"
          echo "::endgroup::"

      - name: Preflight validation
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}
        run: |
          missing=0

          check() {
            local name="$1" reason="$2" value="$3"
            if [ -z "$value" ]; then
              echo "::error::Missing: $name"
              echo "$reason"
              missing=$((missing+1))
            fi
          }

          check STAGING_HOST "Hostname for DNS + SSL probes." "$STAGING_HOST"
          check STAGING_BASE_URL "Base URL for HTTP readiness probes." "$STAGING_BASE_URL"
          check STAGING_EXPECTED_IP "Expected origin IP." "$STAGING_EXPECTED_IP"

          if [ "$missing" -gt 0 ]; then
            echo "::error::Missing required secrets/variables"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system deps
        run: sudo apt-get update -y && sudo apt-get install -y dnsutils openssl openssh-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ✅ FIX: safe SSH check (no invalid empty string expression in workflow_call context)
      - name: Write SSH key (if provided)
        if: ${{ secrets.SSH_KEY != null && secrets.SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run readiness checker
        id: check
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EXPECTED_IP: ${{ vars.STAGING_EXPECTED_IP }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_PATH: ${{ secrets.SSH_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/apps/higaet' }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.READINESS_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun scripts/check-staging-readiness.ts

      - name: Validate deep links
        if: always()
        run: |
          OK="${{ steps.check.outputs.deep_links_ok }}"
          echo "deep_links_ok=$OK"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}
          path: |
            test-results/readiness/**
            docs/infrastructure/phase-2-2-prerequisite-report.md
            docs/infrastructure/staging-readiness-history.md

      - name: Commit report
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "higaet-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/infrastructure/ || true

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(readiness): update report [skip ci]"
          git push || true

      - name: Post transition issue
        if: steps.check.outputs.transitioned == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `STAGING READY — ${context.runId}`,
              body: "Readiness checks passed.",
              labels: ["readiness"]
            });
