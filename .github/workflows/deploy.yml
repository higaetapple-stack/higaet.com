name: Deploy (Production — Node SSR → MilesWeb)

# CANONICAL AND ONLY DEPLOYMENT PIPELINE.
#
#   Lovable → GitHub → [this workflow] → MilesWeb cPanel + Passenger
#
# One runtime (Node.js 22 SSR / Nitro node-server), one build
# (`npm run build:node`), one package manager (npm), one deploy path
# (_deploy-kernel.yml). Cloudflare Workers output is never built, never
# uploaded and never deployed.
#
# Stage order:
#   preflight-kernel  → kernel contract validated at the selected SHA
#   preflight-context → required secrets/vars exist in the environment
#   build             → npm ci + npm run build:node + artifact verification
#   deploy            → rsync release, symlink swap, Passenger restart
#   verify            → healthz / readyz / SSR smoke against the live URL

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Public URL to verify after deploy"
        required: true
        type: string
        default: "https://higaet.com"
      skip_verify:
        description: "Skip post-deploy verification (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  # Strong lock. Never cancel a deploy in-flight; queue instead.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-kernel:
    name: Preflight — kernel contract @ selected SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Report selected SHA
        run: |
          echo "::notice::Preflight running against $(git rev-parse HEAD)"
          echo "::notice::Ref: ${GITHUB_REF} (event=${GITHUB_EVENT_NAME})"

      - name: Validate _deploy-kernel.yml contract
        run: node scripts/check-deploy-kernel.mjs

  preflight-context:
    name: Preflight — secrets/vars present in production
    needs: [preflight-kernel]
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_SSH_KEY: ${{ secrets.SSH_KEY != '' }}
      HAS_SSH_HOST: ${{ secrets.SSH_HOST != '' }}
      HAS_SSH_USER: ${{ secrets.SSH_USER != '' }}
      HAS_SSH_PORT: ${{ secrets.SSH_PORT != '' }}
      HAS_DEPLOY_DIR: ${{ vars.DEPLOY_DIR != '' }}
      # Diagnostic only — presence indicates leftover legacy configuration.
      HAS_LEGACY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Verify deploy environment context
        run: |
          set -e
          echo "Environment: production"
          echo ""
          echo "Required secrets:"
          echo "  SSH_KEY   present : ${HAS_SSH_KEY}"
          echo "  SSH_HOST  present : ${HAS_SSH_HOST}"
          echo "  SSH_USER  present : ${HAS_SSH_USER}"
          echo "  SSH_PORT  present : ${HAS_SSH_PORT}"
          echo ""
          echo "Required vars:"
          echo "  DEPLOY_DIR present : ${HAS_DEPLOY_DIR}"
          echo ""
          echo "Diagnostics:"
          echo "  Legacy SSH_PRIVATE_KEY secret present : ${HAS_LEGACY_SSH_PRIVATE_KEY}"

          MISSING=0
          for v in HAS_SSH_KEY HAS_SSH_HOST HAS_SSH_USER HAS_SSH_PORT HAS_DEPLOY_DIR; do
            if [ "${!v}" != "true" ]; then
              name="${v#HAS_}"
              case "$v" in
                HAS_DEPLOY_DIR)
                  echo "::error::Missing repository variable vars.${name} in environment 'production'. Add it under Settings → Environments → production → Variables."
                  ;;
                *)
                  echo "::error::Missing secret secrets.${name} in environment 'production'. Add it under Settings → Environments → production → Secrets."
                  ;;
              esac
              MISSING=1
            fi
          done

          if [ "${HAS_LEGACY_SSH_PRIVATE_KEY}" = "true" ]; then
            echo "::warning::Environment 'production' still stores a legacy secret named SSH_PRIVATE_KEY. The current deploy kernel does not use it — safe to remove."
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Preflight aborted — configure the missing secret(s)/var(s) and re-run."
            exit 1
          fi

          echo "::notice::Preflight context OK for 'production'."

  build:
    name: Build Node SSR artifact (Nitro node-server)
    needs: [preflight-kernel, preflight-context]
    # Produces the `dist` artifact containing .output/server/index.mjs, app.js,
    # package.json, package-lock.json and scripts/. The deploy kernel downloads
    # it from THIS run — the build job must never be skipped.
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      run-lint: false
      run-typecheck: true
      run-build: true
      build-command: "npm run build:node"
      build-target: "node"
      upload-artifact: true
      artifact-name: dist
    secrets: inherit

  deploy:
    name: Deploy to MilesWeb (Passenger)
    needs: [preflight-kernel, preflight-context, build]
    uses: ./.github/workflows/_deploy-kernel.yml
    with:
      target: production
      artifact_name: dist
      public_url: ${{ inputs.public_url }}
      health_timeout_ms: "180000"
    secrets: inherit


  verify:
    name: Post-deploy verification
    needs: [build, deploy]
    if: ${{ !inputs.skip_verify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"

      - name: Run post-deploy smoke (healthz + readyz + SSR meta)
        env:
          SMOKE_BASE_URL: ${{ inputs.public_url }}
          SMOKE_TIMEOUT_MS: "180000"
        run: node --experimental-strip-types scripts/postdeploy-smoke.ts

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Production deploy — Node SSR"
            echo ""
            echo "- Target URL: ${{ inputs.public_url }}"
            echo "- Build: ${{ needs.build.result }}"
            echo "- Deploy: ${{ needs.deploy.result }}"
            echo "- Verify: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
