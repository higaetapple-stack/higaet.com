name: License Audit

# Thin wrapper — delegates to _security-kernel.yml.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lockb"
      - "bun.lock"
      - ".github/workflows/license-audit.yml"
      - ".github/workflows/_security-kernel.yml"
      - ".github/license-allowlist.json"
  pull_request:
    paths:
      - "package.json"
      - "bun.lockb"
      - "bun.lock"
      - ".github/workflows/license-audit.yml"
      - ".github/workflows/_security-kernel.yml"
      - ".github/license-allowlist.json"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  licenses:
    uses: ./.github/workflows/_security-kernel.yml
    with:
      run-dependency-audit: false
      run-license-audit: true
    secrets: inherit
