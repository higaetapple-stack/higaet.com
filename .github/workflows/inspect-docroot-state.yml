name: Inspect Docroot State (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read-only inspect docroot top-level + backups
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            DOC=\"$DEPLOY_DIR\"
            echo '=== TOP-LEVEL ls ==='
            ls -la \"\$DOC\" | head -40
            echo '=== .output exists? size ==='
            ls -la \"\$DOC/.output/server/index.mjs\" 2>/dev/null || echo NO_TOPLEVEL_OUTPUT
            echo '=== backups (my .output.stale-bak and .old-*) ==='
            ls -d \"\$DOC\"/.output.stale-bak-* 2>/dev/null
            ls -d \"\$DOC\"/.old-* 2>/dev/null
            echo '=== .env present? ==='
            ls -la \"\$DOC/.env\" 2>/dev/null && echo HAS_ENV || echo NO_ENV
            echo '=== current symlink ==='
            readlink \"\$DOC/current\" 2>/dev/null || echo NO_CURRENT
            echo '=== current release assets exist? ==='
            ls \"\$DOC/current/.output/public/assets/\" 2>/dev/null | grep '^academy.index-' | head
            echo '=== old bak contents: does it hold a .output? ==='
            for b in \"\$DOC\"/.output.stale-bak-*; do [ -d \"\$b\" ] && echo \"\$b has:\" && ls \"\$b\" | head; done
            echo '=== passenger procs ==='
            pgrep -fal 'node.*higaet' || echo NO_NODE_PROC
          "