name: Authorization Verification (Fixtures)

# Runs the readiness checker in fixture mode for both NO-GO and GO paths
# to verify the authorization gate logic without a live staging target.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/check-staging-readiness.ts"
      - ".github/workflows/staging-readiness.yml"
      - ".github/workflows/phase-2-2-authorization.yml"
      - ".github/workflows/authorization-verification.yml"

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ["NO-GO", "GO"]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund

      - name: Run checker (fixture=${{ matrix.fixture }})
        id: run
        continue-on-error: true
        env:
          READINESS_FIXTURE_STATUS: ${{ matrix.fixture }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --experimental-strip-types scripts/check-staging-readiness.ts

      - name: Assert exit code matches fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
          OUTCOME: ${{ steps.run.outcome }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          echo "fixture=$FIXTURE outcome=$OUTCOME status=$STATUS"
          if [ "$FIXTURE" = "GO" ] && [ "$OUTCOME" = "success" ] && [ "$STATUS" = "GO" ]; then
            echo "PASS: GO fixture authorized"; exit 0
          fi
          if [ "$FIXTURE" = "NO-GO" ] && [ "$OUTCOME" = "failure" ] && [ "$STATUS" = "NO-GO" ]; then
            echo "PASS: NO-GO fixture blocked"; exit 0
          fi
          echo "::error::Fixture $FIXTURE produced unexpected outcome=$OUTCOME status=$STATUS"
          exit 1

      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-verification-${{ matrix.fixture }}-${{ github.run_id }}
          path: |
            test-results/readiness/**
            docs/infrastructure/phase-2-2-prerequisite-report.md
