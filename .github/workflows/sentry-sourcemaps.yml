name: Upload Sentry Sourcemaps

# Build-Once compliant (P10):
#   - Delegates the Node-target build to _ci-kernel.yml (the only allowed builder).
#   - Downloads the kernel-produced artifact and runs sentry-cli against it.
#   - Skips the entire workflow cleanly when SENTRY_AUTH_TOKEN is absent.
#   - Verifies dist/ exists in the downloaded artifact before uploading sourcemaps.

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping sourcemap upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # Build via the canonical kernel. Any Node-target rebuild MUST happen here,
  # not in a bespoke run: step, to satisfy the Build-Once contract enforced
  # by ci-integrity-guard.yml.
  build:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      mode: core
      run-lint: false
      run-typecheck: false
      run-build: true
      build-command: "npm run build:node"
      build-target: "node"
      upload-artifact: true
      artifact-name: sentry-node-build
    secrets: inherit

  upload:
    needs: [guard, build]
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-node

      - name: Download kernel build artifact
        uses: actions/download-artifact@v4
        with:
          name: sentry-node-build
          path: .

      # Hard artifact guard: if the downloaded artifact is missing dist/ we must
      # NOT continue to sentry-cli — that would silently upload nothing and
      # succeed. Fail loudly with a diagnostic instead.
      - name: Verify build artifacts exist
        run: |
          set -e
          if [ ! -d ./dist ] || [ -z "$(ls -A ./dist 2>/dev/null)" ]; then
            echo "::error::Expected ./dist to exist and be non-empty in the downloaded artifact. Aborting sourcemap upload."
            exit 1
          fi
          echo "dist/ OK ($(find ./dist -type f | wc -l) files)"
          if [ -d ./.output ]; then
            echo ".output/ present ($(find ./.output -type f | wc -l) files)"
          else
            echo "::notice::.output/ missing — Node SSR bundle not emitted; skipping .output upload."
          fi

      # NOTE: sentryVitePlugin uploads during the kernel build only if the
      # Sentry env vars are present in the kernel's build step env. This
      # step is the canonical uploader — it uploads the sourcemaps that
      # were emitted next to the compiled JS in the downloaded artifact.
      - name: Upload sourcemaps and finalize release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'higaet-5y' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'javascript-react' }}
          VITE_SENTRY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          set -e
          RELEASE="${VITE_SENTRY_ENV:-production}-${{ github.sha }}"
          npx --yes @sentry/cli releases new "$RELEASE"
          npx --yes @sentry/cli sourcemaps upload --release "$RELEASE" ./dist
          if [ -d ./.output ]; then
            npx --yes @sentry/cli sourcemaps upload --release "$RELEASE" ./.output
          fi
          # set-commits --auto tolerates first-release / shallow-clone edge cases;
          # keep the soft-fail here only (not on uploads).
          npx --yes @sentry/cli releases set-commits "$RELEASE" --auto || \
            echo "::warning::set-commits --auto failed (likely first release or shallow clone) — continuing."
          npx --yes @sentry/cli releases finalize "$RELEASE"
