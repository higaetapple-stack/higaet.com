name: Brevo CI/CD Pipeline

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - staging
    # Path filter: skip runs on docs / metadata-only changes.
    paths:
      - "src/**"
      - "public/**"
      - "supabase/**"
      - "app.js"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "scripts/**"
      - ".github/actions/setup-node-bun/**"
      - ".github/workflows/higaet-brevo-cicd.yml"


concurrency:
  group: brevo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Single source of truth: all SSH/staging secrets live in the `staging`
    # GitHub Environment. Repo-level fallbacks are intentionally NOT used —
    # they mask misconfiguration.
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # ----------------------------
      # NODE / DEPENDENCIES
      # ----------------------------
      # P1: unified toolchain via composite action (Node 22 + Bun,
      # cached, frozen-lockfile install). Replaces the previous inline
      # setup-node + `npm ci` block. Bun is now the single installer
      # across CI; bun.lock is the canonical lockfile.
      - name: Setup toolchain (Node 22 + Bun, frozen install)
        uses: ./.github/actions/setup-node-bun

      # Belt-and-braces: composite action already pins Node 22, but keep
      # the explicit drift guard — GitHub runners have historically
      # shifted the default toolcache between 20/22/24.
      - name: Verify Node version
        run: |
          set -eu
          EXPECTED="v22"
          ACTUAL="$(node -v)"
          echo "Node version: $ACTUAL"
          case "$ACTUAL" in
            ${EXPECTED}.*) ;;
            *)
              echo "::error::Invalid Node version. Expected ${EXPECTED}.x, got $ACTUAL"
              exit 1
              ;;
          esac

      # ----------------------------
      # ENV PREFLIGHT (FAIL LOUD)
      # ----------------------------
      - name: Validate environment
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -u
          MISSING=0
          for v in STAGING_HOST STAGING_BASE_URL SSH_HOST SSH_USER SSH_PORT SSH_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret in staging environment: $v"
              MISSING=$((MISSING+1))
            else
              echo "  ok  $v"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::Preflight failed — configure the missing secrets on the 'staging' GitHub Environment."
            exit 1
          fi

      # ----------------------------
      # SSH SETUP (format-agnostic, fail loud)
      # ----------------------------
      # We accept both RSA and ED25519 private keys. The file is always
      # written to a neutral path (~/.ssh/id_deploy) so downstream steps
      # never assume a specific key algorithm.
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Detect key format for diagnostics; do NOT rename the file.
          if head -1 ~/.ssh/id_deploy | grep -q 'OPENSSH PRIVATE KEY'; then
            echo "SSH key format: OpenSSH (likely ED25519 or newer RSA)"
          elif head -1 ~/.ssh/id_deploy | grep -q 'RSA PRIVATE KEY'; then
            echo "SSH key format: PEM RSA"
          else
            echo "::error::SSH_KEY does not look like a valid private key (bad header)"
            head -1 ~/.ssh/id_deploy || true
            exit 1
          fi

          # Trust the host up front so ssh doesn't hang or silently skip.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "::error::ssh-keyscan failed for $SSH_HOST:$SSH_PORT"
            exit 1
          }

          echo "SSH_KEY_PATH=/home/runner/.ssh/id_deploy" >> "$GITHUB_ENV"

      # ----------------------------
      # ESM SAFETY GATE (blocks Node ESM regressions + bun in build chain)
      # ----------------------------
      - name: ESM safety check
        run: node scripts/ci-esm-safety-check.mjs

      # ----------------------------
      # BUILD STEP
      # ----------------------------
      - name: Build project
        run: npm run build

      # ----------------------------
      # DATADOG (non-blocking by design — observability, not deploy gate)
      # ----------------------------
      - name: Run Datadog Synthetic Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "${DD_API_KEY:-}" ] || [ -z "${DD_APP_KEY:-}" ]; then
            echo "::warning::Datadog keys missing — skipping synthetic tests"
            exit 0
          fi
          npx --yes @datadog/datadog-ci synthetics run-tests || {
            echo "::warning::Datadog Synthetic tests failed — non-blocking"
          }

      # ----------------------------
      # DEPLOY STEP (fail loud on any SSH problem)
      # ----------------------------
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu
          if [ ! -f "$SSH_KEY_PATH" ]; then
            echo "::error::SSH key not present at $SSH_KEY_PATH — Setup SSH step failed"
            exit 1
          fi

          ssh -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "$SSH_PORT" \
              -i "$SSH_KEY_PATH" \
              "$SSH_USER@$SSH_HOST" \
              "echo 'SSH OK on '$(hostname)"

      # ----------------------------
      # POST BUILD CLEANUP
      # ----------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brevo-ci-${{ github.run_id }}
          path: |
            logs/**
            dist/**
          if-no-files-found: ignore

      - name: Notify success
        if: success()
        run: echo "CI completed successfully"
