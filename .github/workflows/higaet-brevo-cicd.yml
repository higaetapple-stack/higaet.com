name: HIGAET Brevo CI/CD (Self-Diagnosing)

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  brevo-ci:
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      LAUNCH_READINESS_INGEST_SECRET: ${{ secrets.LAUNCH_READINESS_INGEST_SECRET }}

    steps:
      - uses: actions/checkout@v4

      # 1. ENV DIAGNOSIS
      - name: Diagnose environment
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "DIAGNOSIS=BREVO_ENV_MISSING"; exit 1
          fi
          echo "DIAGNOSIS=ENV_OK"

      # 2. SAFE SECRET SCAN (real key shape only)
      - name: Secret leak scan
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
               -E "xkeysib-[A-Za-z0-9]{16,}" . ; then
            echo "DIAGNOSIS=BREVO_SECRET_LEAK"; exit 1
          fi
          echo "DIAGNOSIS=SCAN_OK"

      # 3. BUILD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit || { echo "DIAGNOSIS=TYPECHECK_FAIL"; exit 1; }
      - name: Build
        run: bun run build || { echo "DIAGNOSIS=BUILD_FAIL"; exit 1; }

      # 4. BREVO AUTH DIAGNOSIS
      - name: Brevo API test
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.brevo.com/v3/account \
            -H "api-key: $BREVO_API_KEY")
          echo "Brevo HTTP_CODE=$HTTP_CODE"
          case "$HTTP_CODE" in
            200) echo "DIAGNOSIS=BREVO_AUTH_OK" ;;
            401) echo "DIAGNOSIS=BREVO_AUTH_FAILED_INVALID_KEY"; exit 1 ;;
            403) echo "DIAGNOSIS=BREVO_AUTH_FORBIDDEN"; exit 1 ;;
            *)   echo "DIAGNOSIS=BREVO_NETWORK_OR_TIMEOUT"; exit 1 ;;
          esac

      # 5. APP HEALTH DIAGNOSIS
      - name: Email endpoint test
        if: env.APP_BASE_URL != ''
        run: |
          RESPONSE=$(curl -s -X POST "$APP_BASE_URL/api/public/email-verify" \
            -H "Authorization: Bearer $LAUNCH_READINESS_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"to":"admin@higaet.com"}')
          echo "Response=$RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "DIAGNOSIS=EMAIL_SYSTEM_OK"
          elif echo "$RESPONSE" | grep -q '"success":false'; then
            echo "DIAGNOSIS=EMAIL_LOGIC_FAIL"; exit 1
          else
            echo "DIAGNOSIS=EMAIL_ENDPOINT_BROKEN"; exit 1
          fi

  deploy:
    needs: brevo-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
