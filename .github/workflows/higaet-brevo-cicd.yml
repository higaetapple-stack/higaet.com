name: HIGAET Brevo CI/CD (Self-Healing + Incidents)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      override_decision:
        description: "Break-glass override: DEPLOY | CANARY | BLOCK | ROLLBACK | NONE"
        type: choice
        default: "NONE"
        options: [NONE, DEPLOY, CANARY, BLOCK, ROLLBACK]
      override_reason:
        description: "Reason for override (required if override_decision != NONE)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  issues: write



jobs:
  brevo-ci:
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      LAUNCH_READINESS_INGEST_SECRET: ${{ secrets.LAUNCH_READINESS_INGEST_SECRET }}
    outputs:
      diagnosis: ${{ steps.finalize.outputs.diagnosis }}
      status: ${{ steps.finalize.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      # 1. ENV (no retry)
      - name: Diagnose environment
        id: env_check
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "diagnosis=BREVO_ENV_MISSING" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "diagnosis=ENV_OK" >> "$GITHUB_OUTPUT"

      # 2. Secret leak scan (no retry)
      - name: Secret leak scan
        id: scan
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
               -E "xkeysib-[A-Za-z0-9]{16,}" . ; then
            echo "diagnosis=BREVO_SECRET_LEAK" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "diagnosis=SCAN_OK" >> "$GITHUB_OUTPUT"

      # 3. Build (no retry)
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        run: bunx tsgo --noEmit || { echo "diagnosis=TYPECHECK_FAIL" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Build
        id: build
        run: bun run build || { echo "diagnosis=BUILD_FAIL" >> "$GITHUB_OUTPUT"; exit 1; }

      # 4. Brevo auth — retry only on network/timeout
      - name: Brevo API test (auto-heal)
        id: brevo
        run: |
          attempt=0
          while [ $attempt -lt 3 ]; do
            attempt=$((attempt+1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://api.brevo.com/v3/account \
              -H "api-key: $BREVO_API_KEY" || echo "000")
            echo "attempt=$attempt http=$HTTP_CODE"
            case "$HTTP_CODE" in
              200)
                echo "diagnosis=BREVO_AUTH_OK" >> "$GITHUB_OUTPUT"
                [ $attempt -gt 1 ] && echo "status=RECOVERED" >> "$GITHUB_OUTPUT" || echo "status=OK" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              401)
                echo "diagnosis=BREVO_AUTH_FAILED_INVALID_KEY" >> "$GITHUB_OUTPUT"; exit 1 ;;
              403)
                echo "diagnosis=BREVO_AUTH_FORBIDDEN" >> "$GITHUB_OUTPUT"; exit 1 ;;
              *)
                [ $attempt -lt 3 ] && sleep 5 && continue
                echo "diagnosis=BREVO_NETWORK_OR_TIMEOUT" >> "$GITHUB_OUTPUT"; exit 1 ;;
            esac
          done

      # 5. Email endpoint — single retry on broken response
      - name: Email endpoint test (auto-heal)
        id: email
        if: env.APP_BASE_URL != ''
        run: |
          check() {
            curl -s -X POST "$APP_BASE_URL/api/public/email-verify" \
              -H "Authorization: Bearer $LAUNCH_READINESS_INGEST_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"to":"admin@higaet.com"}'
          }
          for attempt in 1 2; do
            RESPONSE=$(check)
            echo "attempt=$attempt response=$RESPONSE"
            if echo "$RESPONSE" | grep -q '"success":true'; then
              echo "diagnosis=EMAIL_SYSTEM_OK" >> "$GITHUB_OUTPUT"
              [ $attempt -gt 1 ] && echo "status=RECOVERED" >> "$GITHUB_OUTPUT" || echo "status=OK" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$RESPONSE" | grep -q '"success":false'; then
              echo "diagnosis=EMAIL_LOGIC_FAIL" >> "$GITHUB_OUTPUT"; exit 1
            fi
            sleep 5
          done
          echo "diagnosis=EMAIL_ENDPOINT_BROKEN" >> "$GITHUB_OUTPUT"; exit 1

      - name: Finalize
        id: finalize
        if: always()
        run: |
          DIAG="${{ steps.email.outputs.diagnosis || steps.brevo.outputs.diagnosis || steps.build.outputs.diagnosis || steps.typecheck.outputs.diagnosis || steps.scan.outputs.diagnosis || steps.env_check.outputs.diagnosis }}"
          echo "diagnosis=$DIAG" >> "$GITHUB_OUTPUT"
          echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  incident:
    needs: brevo-ci
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Dedupe + update incident
        id: incident
        uses: actions/github-script@v7
        with:
          script: |
            const diag = "${{ needs.brevo-ci.outputs.diagnosis }}" || "UNKNOWN";
            const branch = context.ref.replace("refs/heads/", "");
            const scope = `${diag}::${branch}`;
            const title = `[HIGAET CI INCIDENT] ${diag} (${branch})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();

            // Auth/build/leak = CRITICAL regardless of count
            const criticalCodes = new Set([
              "BREVO_AUTH_FAILED_INVALID_KEY", "BREVO_AUTH_FORBIDDEN",
              "BREVO_SECRET_LEAK", "BREVO_ENV_MISSING",
              "TYPECHECK_FAIL", "BUILD_FAIL",
            ]);

            const severityFor = (count) => {
              if (criticalCodes.has(diag) || count >= 8) return "CRITICAL";
              if (count >= 5) return "HIGH";
              if (count >= 3) return "MEDIUM";
              return "LOW";
            };

            // Find existing OPEN incident by scope marker in body
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "incident,brevo", per_page: 100,
            });
            const existing = open.find(i => i.body && i.body.includes(`<!-- scope:${scope} -->`));

            let count = 1, prevSev = "LOW";
            if (existing) {
              const m = existing.body.match(/<!-- count:(\d+) -->/);
              count = (m ? parseInt(m[1], 10) : 1) + 1;
              const s = existing.body.match(/<!-- severity:(\w+) -->/);
              prevSev = s ? s[1] : "LOW";
            }
            const severity = severityFor(count);
            const state = count === 1 ? "OPEN" : (count >= 5 ? "DEGRADED" : "OPEN");

            const header = [
              `<!-- scope:${scope} -->`,
              `<!-- count:${count} -->`,
              `<!-- severity:${severity} -->`,
              ``,
              `**DIAGNOSIS:** \`${diag}\``,
              `**Scope:** \`${branch}\``,
              `**State:** \`${state}\` | **Severity:** \`${severity}\` | **Occurrences:** ${count}`,
              `**Last seen:** ${ts}`,
              ``,
              `---`,
              `### Timeline`,
            ].join("\n");

            const entry = `- ${ts} — \`${diag}\` failed · [run](${runUrl}) · commit \`${context.sha.slice(0,7)}\``;

            if (existing) {
              const oldTimeline = existing.body.split("### Timeline")[1] || "";
              const body = `${header}\n${entry}${oldTimeline}`;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.setOutput("issue", existing.number);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: `${header}\n${entry}`,
                labels: ["incident", "ci", "brevo"],
              });
              core.setOutput("issue", created.number);
            }
            core.setOutput("severity", severity);
            core.setOutput("prev_severity", prevSev);
            core.setOutput("count", String(count));

      # Slack only on severity change or CRITICAL — no spam
      - name: Slack alert (severity gated)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' && (steps.incident.outputs.severity != steps.incident.outputs.prev_severity || steps.incident.outputs.severity == 'CRITICAL') }}
        run: |
          DIAG="${{ needs.brevo-ci.outputs.diagnosis }}"
          SEV="${{ steps.incident.outputs.severity }}"
          CNT="${{ steps.incident.outputs.count }}"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 HIGAET CI ${SEV}\\nDIAGNOSIS: ${DIAG}\\nOccurrences: ${CNT}\\nIssue: #${{ steps.incident.outputs.issue }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  predict:
    needs: brevo-ci
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: read
    outputs:
      risk: ${{ steps.p.outputs.risk }}
      level: ${{ steps.p.outputs.level }}
      decision: ${{ steps.p.outputs.decision }}
    steps:
      - name: Compute PREDICTED_RISK_SCORE
        id: p
        uses: actions/github-script@v7
        with:
          script: |
            const diag = "${{ needs.brevo-ci.outputs.diagnosis }}" || "UNKNOWN";

            // Last 5 workflow runs (excluding the current one) for this workflow
            const { data: runsResp } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              per_page: 10,
            });
            const wfRuns = runsResp.workflow_runs
              .filter(r => r.name && r.name.startsWith("HIGAET Brevo CI/CD") && r.id !== context.runId)
              .slice(0, 5);
            const failedRecent = wfRuns.filter(r => r.conclusion === "failure").length;

            // Open incidents
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "incident,brevo", per_page: 100,
            });

            let risk = 0;
            const counts = {};
            let criticalRepeats = 0;
            let authTrend = 0;
            for (const i of issues) {
              const cm = (i.body || "").match(/<!-- count:(\d+) -->/);
              const sm = (i.body || "").match(/<!-- severity:(\w+) -->/);
              const c = cm ? parseInt(cm[1], 10) : 1;
              const sev = sm ? sm[1] : "LOW";
              const title = i.title || "";
              counts[title] = c;
              if (sev === "CRITICAL" && c >= 2) criticalRepeats++;
              if (/BREVO_AUTH/.test(title) && c >= 2) authTrend++;
            }

            // Same DIAGNOSIS repeating ≥3 of last 5
            if (diag !== "UNKNOWN") {
              const sameDiagOpen = Object.entries(counts).find(([t]) => t.includes(diag));
              if (sameDiagOpen && sameDiagOpen[1] >= 3) risk += 20;
            }
            if (authTrend > 0) risk += 25;
            if (failedRecent >= 3) risk += 15;       // retry/instability proxy
            if (failedRecent >= 2) risk += 20;       // health trend down
            if (criticalRepeats > 0) risk += 30;

            risk = Math.min(100, risk);
            let level, decision;
            if (risk >= 80) { level = "CRITICAL"; decision = "BLOCKED"; }
            else if (risk >= 60) { level = "HIGH"; decision = "BLOCKED"; }
            else if (risk >= 30) { level = "MEDIUM"; decision = "WARNING"; }
            else { level = "LOW"; decision = "ALLOW"; }

            core.info(`PREDICTED_RISK_SCORE: ${risk}\nRISK_LEVEL: ${level}\nDEPLOYMENT_DECISION: ${decision}`);
            await core.summary
              .addHeading("HIGAET Predictive Risk")
              .addRaw(`**Risk:** ${risk}/100  \n**Level:** \`${level}\`  \n**Decision:** \`${decision}\`  \n**Recent failed runs (last 5):** ${failedRecent}`)
              .write();
            core.setOutput("risk", String(risk));
            core.setOutput("level", level);
            core.setOutput("decision", decision);

      - name: Slack alert on risk
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' && (steps.p.outputs.level == 'HIGH' || steps.p.outputs.level == 'CRITICAL' || steps.p.outputs.level == 'MEDIUM') }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔮 HIGAET Risk: ${{ steps.p.outputs.risk }}/100 (${{ steps.p.outputs.level }}) → ${{ steps.p.outputs.decision }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  health-score:
    needs: brevo-ci
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      score: ${{ steps.score.outputs.score }}
      status: ${{ steps.score.outputs.status }}
    steps:
      - name: Compute SYSTEM_HEALTH_SCORE
        id: score
        uses: actions/github-script@v7
        with:
          script: |
            const diag = "${{ needs.brevo-ci.outputs.diagnosis }}" || "UNKNOWN";
            const jobStatus = "${{ needs.brevo-ci.result }}"; // success|failure|cancelled

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "incident,brevo", per_page: 100,
            });

            const weights = { LOW: 2, MEDIUM: 5, HIGH: 10, CRITICAL: 25 };
            const hardFloorCodes = new Set([
              "BREVO_SECRET_LEAK", "BREVO_AUTH_FAILED_INVALID_KEY", "BREVO_AUTH_FORBIDDEN",
            ]);

            let score = 100;
            let authFailures = 0;
            let leak = false;

            for (const i of issues) {
              const sm = (i.body || "").match(/<!-- severity:(\w+) -->/);
              const sev = sm ? sm[1] : "LOW";
              score -= weights[sev] ?? 2;
              if ((i.title || "").includes("BREVO_SECRET_LEAK")) leak = true;
              if ((i.title || "").match(/BREVO_AUTH_(FAILED_INVALID_KEY|FORBIDDEN)/)) authFailures++;
            }

            // Per-signal deductions for this run
            if (jobStatus === "failure") {
              if (diag === "BUILD_FAIL" || diag === "TYPECHECK_FAIL") score -= 20;
              if (diag === "BREVO_NETWORK_OR_TIMEOUT") score -= 3;
              if (diag.startsWith("BREVO_AUTH")) { score -= 15; authFailures++; }
              if (diag === "BREVO_SECRET_LEAK") leak = true;
            }

            // Hard floor
            if (leak || authFailures >= 3) score = 0;

            score = Math.max(0, Math.min(100, score));
            let status;
            if (score === 0) status = "UNSTABLE";
            else if (score >= 90) status = "HEALTHY";
            else if (score >= 70) status = "STABLE";
            else if (score >= 50) status = "DEGRADED";
            else status = "CRITICAL";

            const line = `SYSTEM_HEALTH_SCORE: ${score}\nSYSTEM_STATUS: ${status}`;
            core.info(line);
            await core.summary
              .addHeading("HIGAET System Health")
              .addRaw(`**Score:** ${score}/100  \n**Status:** \`${status}\`  \n**Last DIAGNOSIS:** \`${diag}\`  \n**Open incidents:** ${issues.length}`)
              .write();
            core.setOutput("score", String(score));
            core.setOutput("status", status);

      - name: Slack alert on health drop
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' && steps.score.outputs.status != 'HEALTHY' }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"📉 HIGAET Health: ${{ steps.score.outputs.score }}/100 (${{ steps.score.outputs.status }})\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  autonomous-controller:
    name: Autonomous Deployment Controller
    needs: [brevo-ci, predict, health-score]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - name: Decide DEPLOY | CANARY | BLOCK | ROLLBACK
        id: decide
        uses: actions/github-script@v7
        env:
          DIAG: ${{ needs.brevo-ci.outputs.diagnosis }}
          CI_RESULT: ${{ needs.brevo-ci.result }}
          RISK: ${{ needs.predict.outputs.risk }}
          LEVEL: ${{ needs.predict.outputs.level }}
          HEALTH: ${{ needs.health-score.outputs.score }}
          HSTATUS: ${{ needs.health-score.outputs.status }}
          # Governance controls (set via repo Variables; default to NORMAL/ENABLED)
          SYSTEM_MODE: ${{ vars.SYSTEM_MODE || 'NORMAL' }}
          AUTONOMOUS_MODE: ${{ vars.AUTONOMOUS_MODE || 'ENABLED' }}
          OVERRIDE_DECISION: ${{ github.event.inputs.override_decision || 'NONE' }}
          OVERRIDE_REASON: ${{ github.event.inputs.override_reason || '' }}
          OVERRIDE_ACTOR: ${{ github.actor }}
        with:
          script: |
            const diag    = process.env.DIAG    || "UNKNOWN";
            const ci      = process.env.CI_RESULT || "failure";
            const risk    = parseInt(process.env.RISK   || "0", 10);
            const level   = process.env.LEVEL   || "LOW";
            const health  = parseInt(process.env.HEALTH || "0", 10);
            const hstatus = process.env.HSTATUS || "CRITICAL";

            const sysMode    = process.env.SYSTEM_MODE;       // NORMAL | FREEZE
            const autoMode   = process.env.AUTONOMOUS_MODE;   // ENABLED | DISABLED
            const overrideD  = process.env.OVERRIDE_DECISION; // NONE | DEPLOY | CANARY | BLOCK | ROLLBACK
            const overrideR  = process.env.OVERRIDE_REASON || "";
            const actor      = process.env.OVERRIDE_ACTOR;

            // 1. AUTONOMOUS DECISION (base)
            const leak       = diag === "BREVO_SECRET_LEAK";
            const authBroken = diag === "BREVO_AUTH_FAILED_INVALID_KEY" || diag === "BREVO_AUTH_FORBIDDEN";
            let decision, reason, source = "AUTONOMOUS";

            if (leak || authBroken) {
              decision = "ROLLBACK";
              reason   = leak ? "SECRET_LEAK_DETECTED" : "AUTH_SYSTEM_COMPROMISE";
            } else if (ci !== "success" || level === "CRITICAL" || health < 50) {
              decision = "BLOCK";
              reason   = `CRITICAL_STATE ci=${ci} health=${health} level=${level}`;
            } else if (level === "HIGH" || health < 70) {
              decision = "BLOCK";
              reason   = `RISK_STATE health=${health} level=${level} (staging only)`;
            } else if (level === "MEDIUM" || health < 85) {
              decision = "CANARY";
              reason   = `CAUTION_STATE health=${health} level=${level} (10-20% traffic)`;
            } else {
              decision = "DEPLOY";
              reason   = `SAFE_STATE health=${health} level=${level}`;
            }

            // 2. BREAK-GLASS OVERRIDE
            if (overrideD && overrideD !== "NONE") {
              if (!overrideR.trim()) {
                core.setFailed("Override requires override_reason");
                return;
              }
              if ((leak || authBroken) && overrideD !== "ROLLBACK" && overrideD !== "BLOCK") {
                core.setFailed(`Safety override active (${reason}); cannot override to ${overrideD}`);
                return;
              }
              source   = `OVERRIDE by @${actor}`;
              reason   = `${overrideR} (was AUTONOMOUS=${decision}: ${reason})`;
              decision = overrideD;
            }

            // 3. FREEZE MODE — blocks deploys/canary, allows rollback
            let execute = true;
            let executeReason = "ok";
            if (sysMode === "FREEZE" && decision !== "ROLLBACK" && decision !== "BLOCK") {
              execute = false;
              executeReason = "SYSTEM_MODE=FREEZE (deploys suspended)";
            }
            // 4. AUTONOMOUS_MODE DISABLED — observe only, never execute (override always executes)
            if (autoMode === "DISABLED" && !source.startsWith("OVERRIDE")) {
              execute = false;
              executeReason = "AUTONOMOUS_MODE=DISABLED (monitoring only)";
            }
            if (decision === "BLOCK") { execute = false; executeReason = "decision=BLOCK"; }

            const platformState =
              health >= 90 ? "HEALTHY" :
              health >= 70 ? "STABLE"  :
              health >= 50 ? "DEGRADED": "CRITICAL";

            core.info([
              `DEPLOYMENT_DECISION: ${decision}`,
              `DECISION_SOURCE: ${source}`,
              `DECISION_REASON: ${reason}`,
              `SYSTEM_HEALTH_SCORE: ${health}`,
              `RISK_LEVEL: ${level}`,
              `SYSTEM_MODE: ${sysMode}`,
              `AUTONOMOUS_MODE: ${autoMode}`,
              `EXECUTE: ${execute} (${executeReason})`,
              `PLATFORM_STATE: ${platformState}`,
            ].join("\n"));

            await core.summary
              .addHeading("HIGAET Autonomous Controller")
              .addRaw(
                `**Decision:** \`${decision}\` (${source})  \n` +
                `**Reason:** ${reason}  \n` +
                `**Execute:** \`${execute}\` — ${executeReason}  \n` +
                `**Health:** ${health}/100 (${hstatus}) · **Risk:** ${risk}/100 (${level})  \n` +
                `**System Mode:** \`${sysMode}\` · **Autonomous Mode:** \`${autoMode}\`  \n` +
                `**Platform State:** \`${platformState}\``
              )
              .write();

            core.setOutput("decision", decision);
            core.setOutput("reason", reason);
            core.setOutput("source", source);
            core.setOutput("execute", String(execute));
            core.setOutput("execute_reason", executeReason);
            core.setOutput("platform_state", platformState);
            core.setOutput("system_mode", sysMode);
            core.setOutput("autonomous_mode", autoMode);

      - name: Execute DEPLOY (full)
        if: steps.decide.outputs.execute == 'true' && steps.decide.outputs.decision == 'DEPLOY' && secrets.DEPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Execute CANARY (10-20% traffic)
        if: steps.decide.outputs.execute == 'true' && steps.decide.outputs.decision == 'CANARY' && secrets.CANARY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "${{ secrets.CANARY_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d '{"traffic":15}'

      - name: Execute AUTO-ROLLBACK
        if: steps.decide.outputs.execute == 'true' && steps.decide.outputs.decision == 'ROLLBACK' && secrets.ROLLBACK_WEBHOOK_URL != ''
        run: curl -fsS -X POST "${{ secrets.ROLLBACK_WEBHOOK_URL }}"

      # GOVERNANCE: immutable decision audit log (artifact + tracking issue comment)
      - name: Write decision audit record
        id: audit
        uses: actions/github-script@v7
        env:
          DIAG: ${{ needs.brevo-ci.outputs.diagnosis }}
          HEALTH: ${{ needs.health-score.outputs.score }}
          LEVEL: ${{ needs.predict.outputs.level }}
          DECISION: ${{ steps.decide.outputs.decision }}
          SOURCE: ${{ steps.decide.outputs.source }}
          REASON: ${{ steps.decide.outputs.reason }}
          EXECUTE: ${{ steps.decide.outputs.execute }}
          EXECUTE_REASON: ${{ steps.decide.outputs.execute_reason }}
          PLATFORM_STATE: ${{ steps.decide.outputs.platform_state }}
          SYSTEM_MODE: ${{ steps.decide.outputs.system_mode }}
          AUTONOMOUS_MODE: ${{ steps.decide.outputs.autonomous_mode }}
        with:
          script: |
            const fs = require("fs");
            const record = {
              timestamp: new Date().toISOString(),
              sha: context.sha,
              branch: context.ref.replace("refs/heads/", ""),
              actor: context.actor,
              run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              decision: process.env.DECISION,
              decision_source: process.env.SOURCE,
              decision_reason: process.env.REASON,
              executed: process.env.EXECUTE === "true",
              execute_reason: process.env.EXECUTE_REASON,
              system_health_score: parseInt(process.env.HEALTH || "0", 10),
              risk_level: process.env.LEVEL,
              platform_state: process.env.PLATFORM_STATE,
              system_mode: process.env.SYSTEM_MODE,
              autonomous_mode: process.env.AUTONOMOUS_MODE,
              diagnosis: process.env.DIAG,
            };
            fs.mkdirSync("audit", { recursive: true });
            fs.writeFileSync("audit/decision.json", JSON.stringify(record, null, 2));

            // Find/create the rolling audit tracking issue and append a row
            const auditTitle = "[HIGAET CONTROL PLANE] Decision Audit Log";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "audit,control-plane", per_page: 10,
            });
            let issue = open.find(i => i.title === auditTitle);
            if (!issue) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: auditTitle,
                labels: ["audit", "control-plane"],
                body: "Immutable append-only audit log of all autonomous controller decisions.\n",
              });
              issue = created;
            }
            const row =
              `\n- \`${record.timestamp}\` · **${record.decision}** (${record.decision_source}) · ` +
              `exec=${record.executed} · health=${record.system_health_score} · risk=${record.risk_level} · ` +
              `state=${record.platform_state} · sha=\`${record.sha.slice(0,7)}\` · diag=\`${record.diagnosis}\` · ` +
              `[run](${record.run_url}) — ${record.decision_reason}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body: row,
            });
            core.setOutput("audit_issue", String(issue.number));

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: decision-audit-${{ github.run_id }}
          path: audit/decision.json
          retention-days: 90

      # Mirror the audit record into the Reliability Ops dashboard DB
      - name: POST audit to Reliability Ops dashboard
        if: ${{ secrets.OPS_DASHBOARD_URL != '' && secrets.CI_AUDIT_INGEST_SECRET != '' }}
        run: |
          BODY=$(cat audit/decision.json)
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.CI_AUDIT_INGEST_SECRET }}" | awk '{print $2}')
          curl -fsS -X POST "${{ secrets.OPS_DASHBOARD_URL }}/api/public/ci-audit/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Signature: ${SIG}" \
            --data-binary "$BODY" || echo "ingest POST failed (non-blocking)"


      - name: Escalate incident on ROLLBACK / BLOCK
        if: steps.decide.outputs.decision == 'ROLLBACK' || steps.decide.outputs.decision == 'BLOCK'
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.decide.outputs.decision }}";
            const reason   = "${{ steps.decide.outputs.reason }}";
            const source   = "${{ steps.decide.outputs.source }}";
            const diag     = "${{ needs.brevo-ci.outputs.diagnosis }}";
            const auditNo  = "${{ steps.audit.outputs.audit_issue }}";
            const runUrl   = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[HIGAET AUTONOMOUS] ${decision} — ${diag}`,
              body: `**Decision:** \`${decision}\` (${source})\n**Reason:** ${reason}\n**Diagnosis:** \`${diag}\`\n**Audit:** #${auditNo}\n**Run:** ${runUrl}`,
              labels: ["incident", "autonomous", decision.toLowerCase()],
            });

      - name: Executive status summary
        if: always()
        run: |
          echo "## HIGAET Executive Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployment Decision | \`${{ steps.decide.outputs.decision }}\` (${{ steps.decide.outputs.source }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Executed | \`${{ steps.decide.outputs.execute }}\` — ${{ steps.decide.outputs.execute_reason }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health Score | ${{ needs.health-score.outputs.score }}/100 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Risk Level | ${{ needs.predict.outputs.level }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform State | \`${{ steps.decide.outputs.platform_state }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| System Mode | \`${{ steps.decide.outputs.system_mode }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Autonomous Mode | \`${{ steps.decide.outputs.autonomous_mode }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Audit Issue | #${{ steps.audit.outputs.audit_issue }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Slack autonomous decision
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🤖 HIGAET AUTONOMOUS: ${{ steps.decide.outputs.decision }} (${{ steps.decide.outputs.source }})\\nExecuted: ${{ steps.decide.outputs.execute }} · Platform: ${{ steps.decide.outputs.platform_state }}\\nHealth: ${{ needs.health-score.outputs.score }}/100 · Risk: ${{ needs.predict.outputs.level }}\\nReason: ${{ steps.decide.outputs.reason }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
