# Datadog Synthetic tests — SAFE / OPTIONAL execution.
#
# This workflow never fails CI when Datadog secrets are missing. It checks for
# both DD_API_KEY and DD_APP_KEY at runtime and gracefully skips the synthetic
# test run when either is absent. Configure the secrets in repository settings
# to activate: https://docs.datadoghq.com/account_management/api-app-keys/

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  synthetics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Datadog configuration
        id: dd
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
            echo "Datadog not configured — skipping synthetic tests"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run Datadog Synthetic tests
        if: steps.dd.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          npx --yes @datadog/datadog-ci synthetics run-tests \
            --search 'tag:e2e-tests' || {
            echo "::warning::Datadog Synthetic tests failed — not blocking CI"
            exit 0
          }
