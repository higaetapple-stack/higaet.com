name: PR Checks

# Thin wrapper — delegates to _ci-kernel.yml (lint · typecheck · build) and
# _security-kernel.yml (dependency + license audit). Lighthouse consumes the
# ci-kernel build artifact instead of rebuilding.
#
# BRANCH PROTECTION (manual, one-time):
#   Settings → Branches → Add rule for `main` and `staging`.
#   Require checks: "Lint · Typecheck · Build" and "Lighthouse".
#   Enable "Require branches to be up to date" and "Do not allow bypassing".

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "eslint.config.js"
      - "lighthouserc.json"
      - ".github/workflows/pr-checks.yml"
      - ".github/workflows/_ci-kernel.yml"
      - ".github/actions/setup-node-bun/**"

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      node-version: "22"
      artifact-name: pr-${{ github.event.pull_request.number }}-build
    secrets: inherit

  ts-syntax-gate:
    # Fast pre-flight: fail the PR IMMEDIATELY on any TS parse-level error
    # (TS1109 "Expression expected", TS1128 "Declaration or statement
    # expected", TS1005 "';' expected", etc.). Runs before coverage/a11y
    # so we never burn minutes on unparseable code.
    name: TS syntax gate (TS1xxx)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        uses: ./.github/actions/setup-node-bun
        with:
          node-version: "22"
      - name: Check TS syntax
        run: node scripts/check-ts-syntax.mjs

  lockfile-sync:
    name: Lockfile sync (bun.lock ↔ package-lock.json)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify lockfiles resolve to the same top-level versions
        run: node scripts/check-lockfile-sync.mjs







  lighthouse:
    name: Lighthouse
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-bun
        with:
          install: "false"

      - name: Download build artifact (from ci-kernel)
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: .

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: npx lhci autorun --config=./lighthouserc.json 2>&1 | tee lighthouse.log

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-lighthouse
          path: |
            .lighthouseci
            lighthouse.log
          retention-days: 14
          if-no-files-found: warn
