name: _Deploy Kernel (MilesWeb)
 


# Artifact-based SSH release deploy for MilesWeb (Passenger).
#
# Configuration sources:
#   - secrets.SSH_KEY, secrets.SSH_HOST, secrets.SSH_USER, secrets.SSH_PORT
#   - vars.DEPLOY_DIR  (non-sensitive GitHub Actions repository variable)
# Sync verification: active SSH authentication intentionally reads secrets.SSH_KEY only.
#
# Contract:
#   - Consumes a prebuilt dist/ artifact — NEVER rebuilds on the server.
#   - Uploads to ~/apps/higaet/releases/<release-id>/ via rsync.
#   - Runs predeploy validation on the release folder BEFORE swinging the
#     symlink.
#   - Atomic switch: current -> releases/<release-id>.
#   - Passenger restart: touch tmp/restart.txt.
#   - Post-deploy smoke tests against the live release.
#
# What this kernel does NOT do yet (future work — do not add here without
# first updating docs/infrastructure/deploy-reality-map.md):
#   - Automatic rollback on smoke failure (previous release is preserved on
#     disk, but symlink is not restored automatically).
#   - Multi-region / load-balancer coordination.
#   - Brevo target (kept for compat; currently a no-op guarded stub).

on:
  workflow_call:
    inputs:
      target:
        description: "production (only supported target — Node SSR → MilesWeb/Passenger)"
        type: string
        required: true
      artifact_name:
        description: "Name of the prebuilt dist artifact to download"
        type: string
        required: false
        default: dist
      public_url:
        description: "Public base URL polled for /healthz after the Passenger restart"
        type: string
        required: false
        default: "https://higaet.com"
      health_timeout_ms:
        description: "Give up on /healthz after this many milliseconds"
        type: string
        required: false
        default: "180000"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Guard target
        run: |
          case "${{ inputs.target }}" in
            production)
              echo "::notice::deploying target=production (Node SSR → MilesWeb/Passenger)"
              ;;
            *)
              echo "::error::Unsupported deploy target: '${{ inputs.target }}'. Production is the only deploy target for this repository."
              exit 1
              ;;
          esac

      - name: Validate required secrets
        if: env.SKIP_DEPLOY != '1'
        run: |
          MISSING=0
          for v in SSH_HOST SSH_USER SSH_PORT DEPLOY_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret/env: $v"
              MISSING=1
            fi
          done
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing required secret: SSH_KEY"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Deploy aborted due to missing configuration"
            exit 1
          fi

      - name: Download build artifact
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Verify artifact
        if: env.SKIP_DEPLOY != '1'
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Deploy aborted: dist artifact missing or empty"
            exit 1
          fi
          if [ ! -f "dist/.output/server/index.mjs" ]; then
            echo "::error::Deploy aborted: dist/.output/server/index.mjs missing — CI did not build the Nitro node-server preset"
            exit 1
          fi
          if [ ! -f "dist/app.js" ]; then
            echo "::error::Deploy aborted: dist/app.js missing — Passenger entry not packaged"
            exit 1
          fi
          if [ ! -f "dist/package.json" ]; then
            echo "::error::Deploy aborted: dist/package.json missing — cannot run npm ci on server"
            exit 1
          fi
          if [ ! -f "dist/package-lock.json" ]; then
            echo "::error::Deploy aborted: dist/package-lock.json missing — npm ci --omit=dev requires a lockfile. CI must include package-lock.json in the artifact."
            exit 1
          fi
          if [ -f "dist/.output/wrangler.json" ] || [ -f "dist/.output/_worker.js" ]; then
            echo "::error::Deploy aborted: Cloudflare Workers artifacts found in the release payload. Production is Node SSR only."
            exit 1
          fi
          if [ ! -f "dist/.output/build-manifest.json" ]; then
            echo "::error::Deploy aborted: dist/.output/build-manifest.json missing — CI did not generate the build manifest"
            exit 1
          fi
          PRESET=$(node -e "process.stdout.write(String(require('./dist/.output/build-manifest.json').build.nitroPreset))")
          if [ "$PRESET" != "node-server" ]; then
            echo "::error::Deploy aborted: build manifest reports nitro preset '$PRESET' — production requires 'node-server'"
            exit 1
          fi
          BUNDLE_BYTES=$(wc -c < dist/.output/server/index.mjs | tr -d ' ')
          echo "BUNDLE_BYTES=$BUNDLE_BYTES" >> "$GITHUB_ENV"
          echo "dist artifact OK ($(find dist -type f | wc -l) files, server bundle ${BUNDLE_BYTES} bytes, preset ${PRESET})"
          echo "── build manifest ──"
          cat dist/.output/build-manifest.json

      - name: Generate production install plan
        if: env.SKIP_DEPLOY != '1'
        run: |
          # Deterministic, offline-friendly install command shipped with the
          # release. MilesWeb's cPanel "Run NPM Install" button and any SSH
          # operator can source this to keep server-side installs reliable.
          cat > dist/install-production.sh <<'EOF'
          #!/usr/bin/env bash
          # Auto-generated by CI. Installs runtime deps only, using the pinned
          # package-lock.json shipped in this release. Do not edit by hand.
          set -euo pipefail
          cd "$(dirname "$0")"
          echo "[install] node: $(node -v)"
          echo "[install] npm:  $(npm -v)"
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json missing — cannot npm ci"
            exit 1
          fi
          npm ci --omit=dev --prefer-offline --no-audit --no-fund
          echo "[install] production dependencies installed"
          EOF
          chmod +x dist/install-production.sh
          echo "install-production.sh generated ($(wc -l < dist/install-production.sh) lines)"

      - name: Setup SSH
        if: env.SKIP_DEPLOY != '1'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compute release id
        if: env.SKIP_DEPLOY != '1'
        run: |
          RELEASE="release-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "::notice::release id: $RELEASE"
          echo "DEPLOY_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Create remote release directory
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR/releases/$RELEASE' '$DEPLOY_DIR/tmp'"

      - name: Record previous release (for manual rollback)
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            PREV=\$(readlink '$DEPLOY_DIR/current' || true)
            echo \"\$PREV\" > '$DEPLOY_DIR/.previous-release'
          "

      - name: Upload artifact (rsync)
        if: env.SKIP_DEPLOY != '1'
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/releases/$RELEASE/"

      - name: Verify remote release layout
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            REL='$DEPLOY_DIR/releases/$RELEASE'
            for f in .output/server/index.mjs app.js package.json; do
              if [ ! -f \"\$REL/\$f\" ]; then
                echo \"::error::Missing after rsync: \$REL/\$f\"
                exit 1
              fi
            done
            echo \"Remote release layout OK\"
            ls -la \"\$REL/.output/server/index.mjs\"
          "

      - name: Install production dependencies on host (npm ci --omit=dev)
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_DIR/releases/$RELEASE'
            export PATH=\"\$HOME/nodevenv/bin:\$PATH\"
            command -v node >/dev/null 2>&1 || { echo '::error::node not found on host PATH — check cPanel Node.js app environment'; exit 1; }
            echo \"[install] node: \$(node -v)\"
            echo \"[install] npm:  \$(npm -v)\"
            npm ci --omit=dev --prefer-offline --no-audit --no-fund
            echo '[install] production dependencies installed'
          "

      - name: Predeploy validation (server-side)
        if: env.SKIP_DEPLOY != '1'
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_DIR/releases/$RELEASE'
            if [ -f scripts/predeploy-schema-validation.ts ]; then
              node --experimental-strip-types scripts/predeploy-schema-validation.ts
            else
              echo '::notice::no predeploy-schema-validation.ts in artifact — skipping'
            fi
          "

      - name: Activate release (atomic symlink)
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "ln -sfn '$DEPLOY_DIR/releases/$RELEASE' '$DEPLOY_DIR/current'"

      - name: Trigger Passenger restart
        if: env.SKIP_DEPLOY != '1'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "touch '$DEPLOY_DIR/tmp/restart.txt'"
          echo "DEPLOY_DURATION_MS=$(( ( $(date -u +%s) - DEPLOY_STARTED_AT ) * 1000 ))" >> "$GITHUB_ENV"

      # Hard health gate. Passenger has been restarted; the release is only
      # considered deployed once /healthz answers 200. Failure here rolls the
      # symlink back to the previous release and fails the workflow.
      - name: Post-deploy health check (/healthz)
        id: health
        if: env.SKIP_DEPLOY != '1'
        continue-on-error: true
        env:
          HEALTH_URL: "${{ inputs.public_url }}/healthz"
          HEALTH_TIMEOUT_MS: ${{ inputs.health_timeout_ms }}
          HEALTH_INTERVAL_MS: "5000"
        run: |
          node scripts/wait-for-healthz.mjs 2>&1 | tee health.log
          STATUS=${PIPESTATUS[0]}
          DUR=$(grep -o 'HEALTH_CHECK_DURATION_MS=[0-9]*' health.log | tail -1 | cut -d= -f2)
          echo "HEALTH_DURATION_MS=${DUR:-unknown}" >> "$GITHUB_ENV"
          exit "$STATUS"

      - name: Rollback on failed health check
        if: env.SKIP_DEPLOY != '1' && steps.health.outcome == 'failure'
        run: |
          echo "::warning::/healthz never returned 200 — rolling back"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            PREV=\$(cat '$DEPLOY_DIR/.previous-release' 2>/dev/null || true)
            if [ -z \"\$PREV\" ] || [ ! -d \"\$PREV\" ]; then
              echo '::error::No previous release recorded — manual intervention required'
              exit 1
            fi
            ln -sfn \"\$PREV\" '$DEPLOY_DIR/current'
            touch '$DEPLOY_DIR/tmp/restart.txt'
            echo \"::notice::Rolled back to \$PREV\"
          "
          echo "::error::Deployment failed: application never became healthy."
          exit 1

      # Prune old releases to keep ~/apps/higaet/releases/ bounded.
      # Retains the newest KEEP_RELEASES directories (default 5), always
      # preserving whatever `current` and `.previous-release` point at even
      # if they'd otherwise fall off the list. Failed pruning does not fail
      # the deploy — the release is already live.
      - name: Prune old releases
        if: env.SKIP_DEPLOY != '1'
        continue-on-error: true
        env:
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '5' }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -euo pipefail
            RELEASES_DIR='$DEPLOY_DIR/releases'
            KEEP='${KEEP_RELEASES}'
            [ -d \"\$RELEASES_DIR\" ] || { echo 'no releases dir — skipping'; exit 0; }

            CURRENT=\$(readlink '$DEPLOY_DIR/current' 2>/dev/null | xargs -n1 basename || true)
            PREVIOUS=\$(cat '$DEPLOY_DIR/.previous-release' 2>/dev/null | xargs -n1 basename || true)

            cd \"\$RELEASES_DIR\"
            ALL=\$(ls -1t 2>/dev/null | grep -E '^release-' || true)
            KEPT=0
            echo \"[prune] keeping newest \$KEEP release(s); protecting current=\$CURRENT previous=\$PREVIOUS\"
            for r in \$ALL; do
              if [ \"\$r\" = \"\$CURRENT\" ] || [ \"\$r\" = \"\$PREVIOUS\" ]; then
                echo \"[prune] protect \$r\"
                continue
              fi
              KEPT=\$((KEPT + 1))
              if [ \"\$KEPT\" -le \"\$KEEP\" ]; then
                echo \"[prune] keep    \$r\"
              else
                echo \"[prune] remove  \$r\"
                rm -rf -- \"\$r\"
              fi
            done
            echo '[prune] done. remaining:'
            ls -1t | head -20
          "

      - name: Smoke tests (post-deploy)
        id: smoke
        if: env.SKIP_DEPLOY != '1'
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_DIR/current'
            if [ ! -f scripts/run-smoke-tests.ts ]; then
              echo '::error::scripts/run-smoke-tests.ts missing from release — refusing to deploy without smoke coverage'
              exit 1
            fi
            node --experimental-strip-types scripts/run-smoke-tests.ts
          "

      # P10: automatic symlink revert on smoke failure.
      # Rolls current -> previous release and re-triggers Passenger. The
      # failed release folder is kept on disk for forensic inspection.
      - name: Automatic rollback on smoke failure
        id: rollback
        if: env.SKIP_DEPLOY != '1' && steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Smoke tests failed — attempting automatic rollback"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            PREV=\$(cat '$DEPLOY_DIR/.previous-release' 2>/dev/null || true)
            if [ -z \"\$PREV\" ] || [ ! -d \"\$PREV\" ]; then
              echo '::error::No previous release recorded — manual intervention required'
              exit 1
            fi
            echo \"Reverting current -> \$PREV\"
            ln -sfn \"\$PREV\" '$DEPLOY_DIR/current'
            touch '$DEPLOY_DIR/tmp/restart.txt'
            echo \"::notice::Rollback complete. Failed release preserved at $DEPLOY_DIR/releases/$RELEASE\"
          "

      - name: Fail job if smoke failed
        if: env.SKIP_DEPLOY != '1' && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Deploy failed smoke tests. Rollback status: ${{ steps.rollback.outcome }}"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Production deploy — MilesWeb Passenger (Node SSR)"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Release id | \`${RELEASE:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Server bundle size | ${BUNDLE_BYTES:-unknown} bytes |"
            echo "| Deployment duration | ${DEPLOY_DURATION_MS:-unknown} ms |"
            echo "| Health-check duration | ${HEALTH_DURATION_MS:-unknown} ms |"
            echo "| Health check | ${{ steps.health.outcome }} |"
            echo "| Smoke tests | ${{ steps.smoke.outcome }} |"
            echo ""
            if [ -f dist/.output/build-manifest.json ]; then
              echo "<details><summary>Build manifest</summary>"
              echo ""
              echo '```json'
              cat dist/.output/build-manifest.json
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release=${RELEASE:-unknown} bundleBytes=${BUNDLE_BYTES:-unknown} deployMs=${DEPLOY_DURATION_MS:-unknown} healthMs=${HEALTH_DURATION_MS:-unknown}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deploy failed for target=${{ inputs.target }} release=${RELEASE:-unknown}"
          echo "Previous release symlink target recorded at $DEPLOY_DIR/.previous-release on host."
          echo "Manual rollback: ssh in, then: ln -sfn \"\$(cat $DEPLOY_DIR/.previous-release)\" $DEPLOY_DIR/current && touch $DEPLOY_DIR/tmp/restart.txt"
