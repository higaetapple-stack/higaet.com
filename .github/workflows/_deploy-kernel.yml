name: _Deploy Kernel (MilesWeb)

# Artifact-based SSH release deploy for MilesWeb (Passenger).
#
# Configuration sources:
#   - secrets.SSH_KEY, secrets.SSH_HOST, secrets.SSH_USER, secrets.SSH_PORT
#   - vars.DEPLOY_DIR  (non-sensitive GitHub Actions repository variable)
#
# Intended Layout:
# /home/wnwpopno/higaet.com/
# ├── current -> releases/<release-id>
# ├── releases/
# │   └── release-.../
# └── tmp/

on:
  workflow_call:
    inputs:
      target:
        description: "production (only supported target — Node SSR → MilesWeb/Passenger)"
        type: string
        required: true
      artifact_name:
        description: "Name of the prebuilt dist artifact to download"
        type: string
        required: false
        default: dist
      public_url:
        description: "Public base URL polled for /healthz after the Passenger restart"
        type: string
        required: false
        default: "https://higaet.com"
      health_timeout_ms:
        description: "Give up on /healthz after this many milliseconds"
        type: string
        required: false
        default: "180000"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Guard target and DEPLOY_DIR
        run: |
          case "${{ inputs.target }}" in
            production)
              echo "::notice::deploying target=production (Node SSR → MilesWeb/Passenger)"
              # Fail-closed check for production path
              EXPECTED="/home/wnwpopno/higaet.com"
              if [ "$DEPLOY_DIR" != "$EXPECTED" ]; then
                echo "::error::DEPLOY_DIR mismatch for production. Expected: $EXPECTED, Got: $DEPLOY_DIR"
                exit 1
              fi
              echo "DEPLOY_DIR verified: $DEPLOY_DIR"
              ;;
            *)
              echo "::error::Unsupported deploy target: '${{ inputs.target }}'. Production is the only deploy target."
              exit 1
              ;;
          esac

      - name: Validate required configuration
        run: |
          MISSING=0
          for v in SSH_HOST SSH_USER SSH_PORT DEPLOY_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret/env: $v"
              MISSING=1
            fi
          done
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing required secret: SSH_KEY"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Verify CI artifact (SSR Hard-Gate)
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist artifact missing or empty"
            exit 1
          fi
          # Check core files
          for f in .output/server/index.mjs app.js package.json package-lock.json; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Artifact missing required file: $f"
              exit 1
            fi
          done
          # Verify SSR size
          BUNDLE_BYTES=$(wc -c < dist/.output/server/index.mjs | tr -d ' ')
          BUNDLE_SHA=$(sha256sum dist/.output/server/index.mjs | awk '{print $1}')
          echo "SSR artifact size: $BUNDLE_BYTES bytes"
          echo "SSR artifact sha256: $BUNDLE_SHA"
          if [ "$BUNDLE_BYTES" -lt 1000 ]; then
             echo "::error::SSR artifact seems too small ($BUNDLE_BYTES bytes)"
             exit 1
          fi
          echo "BUNDLE_BYTES=$BUNDLE_BYTES" >> "$GITHUB_ENV"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compute release id
        run: |
          RELEASE="release-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "::notice::release id: $RELEASE"

      - name: Prepare remote filesystem
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR/releases/$RELEASE' '$DEPLOY_DIR/tmp'"

      - name: Record previous release
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            PREV=\$(readlink '$DEPLOY_DIR/current' || echo 'NO_PREVIOUS_RELEASE')
            echo \"\$PREV\" > '$DEPLOY_DIR/.previous-release'
            echo \"Previous release: \$PREV\"
          "

      - name: Upload to release (rsync)
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/releases/$RELEASE/"

      - name: Remote release validation
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            REL='$DEPLOY_DIR/releases/$RELEASE'
            for f in .output/server/index.mjs app.js package.json package-lock.json; do
              if [ ! -s \"\$REL/\$f\" ]; then
                echo \"::error::Remote file missing or empty: \$REL/\$f\"
                exit 1
              fi
            done
            echo \"Remote release validation: PASS\"
            echo \"SSR artifact: PASS\"
          "

      - name: Install dependencies (server-side)
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_DIR/releases/$RELEASE'
            export PATH=\"\$HOME/nodevenv/higaet.com/22/bin:\$PATH\"
            npm ci --omit=dev --prefer-offline --no-audit --no-fund
            echo '[install] production dependencies installed'
          "

      - name: Safe activate symlink
        run: |
          # Atomic symlink replacement that fails if current is a real directory
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            ROOT='$DEPLOY_DIR'
            REL="\$ROOT/releases/$RELEASE"
            LINK="\$ROOT/current"
            TMP_LINK="\$ROOT/current_new"

            if [ -d \"\$LINK\" ] && [ ! -L \"\$LINK\" ]; then
              echo \"::error::'current' exists as a real directory at \$LINK. Aborting to avoid data loss.\"
              echo \"Manual action required: move or remove the 'current' directory.\"
              exit 1
            fi

            ln -sfn \"\$REL\" \"\$TMP_LINK\"
            mv -Tf \"\$TMP_LINK\" \"\$LINK\" 2>/dev/null || mv -f \"\$TMP_LINK\" \"\$LINK\"
            
            # Verify activation
            if [ ! -L \"\$LINK\" ]; then
              echo \"::error::Activation failed: \$LINK is not a symlink\"
              exit 1
            fi
            TARGET=\$(readlink -f \"\$LINK\")
            echo \"ACTIVE RELEASE: $RELEASE\"
            echo \"CURRENT TARGET: \$TARGET\"
            if [ \"\$TARGET\" != \"\$REL\" ]; then
              echo \"::error::Symlink target mismatch. Expected \$REL, got \$TARGET\"
              exit 1
            fi
          "

      - name: Passenger Restart
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            touch '$DEPLOY_DIR/tmp/restart.txt'
            if [ ! -f '$DEPLOY_DIR/tmp/restart.txt' ]; then
              echo '::error::Failed to create restart.txt'
              exit 1
            fi
          "

      - name: Internal health check (/healthz)
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: "${{ inputs.public_url }}/healthz"
          HEALTH_TIMEOUT_MS: ${{ inputs.health_timeout_ms }}
        run: |
          node dist/scripts/wait-for-healthz.mjs

      - name: Internal readiness check (/readyz)
        id: ready
        continue-on-error: true
        env:
          HEALTH_URL: "${{ inputs.public_url }}/readyz"
          HEALTH_TIMEOUT_MS: 30000
        run: |
          # Reuse the health script but for readyz
          node dist/scripts/wait-for-healthz.mjs

      - name: External HTTPS smoke test
        id: external
        continue-on-error: true
        run: |
          curl -Ifs --max-time 10 "${{ inputs.public_url }}/healthz" || exit 1

      - name: Handle deployment status
        run: |
          echo "HEALTH_STATUS=${{ steps.health.outcome }}" >> "$GITHUB_ENV"
          echo "READY_STATUS=${{ steps.ready.outcome }}" >> "$GITHUB_ENV"
          echo "NETWORK_STATUS=${{ steps.external.outcome }}" >> "$GITHUB_ENV"
          
          if [ "${{ steps.health.outcome }}" != "success" ]; then
            echo "::error::Deployment failed: /healthz timeout"
            exit 1
          fi

      - name: Rollback on health failure
        if: failure() && steps.health.outcome != 'success'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            PREV=\$(cat '$DEPLOY_DIR/.previous-release' 2>/dev/null || true)
            if [ -n \"\$PREV\" ] && [ \"\$PREV\" != \"NO_PREVIOUS_RELEASE\" ] && [ -d \"\$PREV\" ]; then
              echo \"Rolling back to \$PREV\"
              ln -sfn \"\$PREV\" '$DEPLOY_DIR/current'
              touch '$DEPLOY_DIR/tmp/restart.txt'
            fi
          "

      - name: Prune releases
        if: success()
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            cd '$DEPLOY_DIR/releases'
            CURRENT=\$(basename \$(readlink '$DEPLOY_DIR/current'))
            PREV=\$(basename \$(cat '$DEPLOY_DIR/.previous-release' 2>/dev/null || echo ''))
            ls -1t | grep '^release-' | grep -v \"\$CURRENT\" | grep -v \"\$PREV\" | tail -n +6 | xargs rm -rf --
          "

      - name: Deployment Summary
        if: always()
        run: |
          STATUS="DEPLOYED"
          if [ "$HEALTH_STATUS" == "success" ] && [ "$READY_STATUS" == "success" ]; then
            STATUS="DEPLOYED_READY"
          elif [ "$HEALTH_STATUS" == "success" ]; then
            STATUS="DEPLOYED_NOT_READY"
          else
            STATUS="DEPLOYMENT_FAILED"
          fi
          
          if [ "$NETWORK_STATUS" != "success" ] && [ "$STATUS" != "DEPLOYMENT_FAILED" ]; then
            STATUS="${STATUS}_NETWORK_UNVERIFIED"
          fi

          echo "### Deployment Report: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release ID | \`$RELEASE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /healthz | $HEALTH_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /readyz | $READY_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| External HTTPS | $NETWORK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "Final Status: $STATUS"

