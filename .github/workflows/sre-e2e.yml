name: SRE E2E Smoke

# Runs the AI SRE end-to-end smoke test (Sentry → AI → PR → CI → readiness)
# by invoking the deployed admin endpoint and asserting the returned status.
# Provides a single job with clear pass/fail reporting for CI dashboards.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      base_url:
        description: "Optional explicit Base URL (overrides environment mapping)"
        required: false
        default: ""
  schedule:
    # Every 6 hours — cheap, but keeps token health + pipeline integrity visible.
    - cron: "0 */6 * * *"

# Least-privilege token: this workflow only invokes an external HTTPS endpoint
# and reads its response. It never writes to the repo, PRs, checks, or actions.
permissions:
  contents: read


jobs:
  sre-e2e:
    name: Sentry → AI → PR → CI → Deploy readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SRE_E2E_BEARER }}" ]; then
            echo "::error::SRE_E2E_BEARER not set. Its value MUST equal the server-side SRE_E2E_TRIGGER_SECRET env var configured on the target deployment."
            exit 1
          fi

      - name: Resolve target BASE_URL
        id: resolve
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          PREVIEW_URL="https://project--019358d1-d5d3-491a-8f03-bd2f647a26b3.lovable.app"
          PRODUCTION_URL="https://staging.higaet.com"
          if [ -n "${INPUT_URL:-}" ]; then
            RESOLVED="$INPUT_URL"
          elif [ "${ENVIRONMENT:-preview}" = "production" ]; then
            RESOLVED="$PRODUCTION_URL"
          else
            RESOLVED="$PREVIEW_URL"
          fi
          echo "base_url=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved BASE_URL=$RESOLVED"

      - name: Trigger E2E smoke test
        id: run
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          BEARER: ${{ secrets.SRE_E2E_BEARER }}
        run: |
          set -euo pipefail
          echo "Invoking $BASE_URL/api/public/sre/e2e-trigger"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            "$BASE_URL/api/public/sre/e2e-trigger" \
            -H "Authorization: Bearer $BEARER" \
            -H "Content-Type: application/json" \
            --data '{}')
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY" | tee response.json
          if [ "$CODE" != "200" ] && [ "$CODE" != "400" ] && [ "$CODE" != "500" ]; then
            echo "::error::E2E trigger failed with unexpected HTTP $CODE"
            exit 1
          fi
          STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('response.json')).status || 'unknown')")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "pending" ]; then
            echo "::warning::E2E smoke returned status=pending — CI checks did not complete in the polling window"
          fi
          if [ "$STATUS" = "failed" ]; then
            echo "::error::E2E smoke returned status=failed"
            exit 1
          fi
          # Invalid/missing status: endpoint MUST return HTTP 400. Fail loudly
          # so a schema drift is not silently reported as passed.
          VALID_STATUSES="passed failed pending"
          if ! echo " $VALID_STATUSES " | grep -q " $STATUS "; then
            echo "::error::E2E smoke returned invalid or missing status=$STATUS"
            exit 1
          fi

      - name: Assert pending returns HTTP 200 (contract check)
        if: always() && steps.run.outputs.status == 'pending'
        env:
          CODE: ${{ steps.run.outputs.http_code }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "200" ]; then
            echo "::error::Contract violation: pending status must return HTTP 200 (got $CODE). The workflow relies on 200-for-pending to emit a warning instead of failing."
            exit 1
          fi
          echo "::notice::Verified: pending run returned HTTP 200 and emitted ::warning:: annotation as expected."

      - name: Assert failed returns HTTP 500 (contract check)
        if: always() && steps.run.outputs.status == 'failed'
        env:
          CODE: ${{ steps.run.outputs.http_code }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "500" ]; then
            echo "::error::Contract violation: failed status must return HTTP 500 (got $CODE)."
            exit 1
          fi
          # Guard against pending-warning leaking into failed responses.
          # The pending ::warning:: annotation is only emitted inside the 'pending' branch
          # of the trigger step, so a failed run must never carry it. This grep is a
          # defense-in-depth check against future edits reordering the branches.
          if grep -q "status=pending" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "::error::Contract violation: failed run must not emit the pending ::warning:: annotation."
            exit 1
          fi
          echo "::notice::Verified: failed run returned HTTP 500 and did not emit the pending warning."

      - name: Assert success returns HTTP 200 (contract check)
        # runSreE2ETest emits status ∈ {passed,failed,pending}; treat anything
        # that isn't failed/pending as a success case (covers 'passed' today
        # and defensively covers a future 'success' rename).
        if: always() && steps.run.outputs.status != 'failed' && steps.run.outputs.status != 'pending' && steps.run.outputs.status != ''
        env:
          CODE: ${{ steps.run.outputs.http_code }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "200" ]; then
            echo "::error::Contract violation: success status ($STATUS) must return HTTP 200 (got $CODE)."
            exit 1
          fi
          if grep -q "status=pending" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "::error::Contract violation: success run must not emit the pending ::warning:: annotation."
            exit 1
          fi
          echo "::notice::Verified: success run (status=$STATUS) returned HTTP 200 and did not emit the pending warning."

      - name: Assert invalid/missing status returns HTTP 400 (contract check)
        # Runs only when the trigger step recorded a status outside the known
        # set (blank, 'unknown', or a future value). The endpoint MUST 400 so
        # schema drift can never masquerade as a pass.
        if: always() && steps.run.outputs.status != 'passed' && steps.run.outputs.status != 'failed' && steps.run.outputs.status != 'pending'
        env:
          CODE: ${{ steps.run.outputs.http_code }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "400" ]; then
            echo "::error::Contract violation: invalid/missing status ($STATUS) must return HTTP 400 (got $CODE)."
            exit 1
          fi
          if grep -q "status=pending" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "::error::Contract violation: invalid-status run must not emit the pending ::warning:: annotation."
            exit 1
          fi
          echo "::notice::Verified: invalid/missing status ($STATUS) returned HTTP 400 and did not emit the pending warning."






      - name: Summary
        if: always()
        run: |
          echo "## SRE E2E Result" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ steps.run.outputs.status || 'error' }}" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat response.json 2>/dev/null || echo '{"error":"no response"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
