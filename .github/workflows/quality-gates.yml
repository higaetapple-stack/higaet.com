name: Quality Gates (coverage + a11y)

# Coverage and accessibility checks. Consumes the ci-kernel build artifact
# (Build-Once compliant — no rebuild). Non-blocking initially:
#   - coverage: report-only until baseline is agreed
#   - a11y: fails on serious/critical WCAG 2.1 A/AA violations only

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/quality-gates.yml"
      - ".github/workflows/_ci-kernel.yml"
  workflow_dispatch: {}

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Reuse the canonical builder — Build-Once contract.
    uses: ./.github/workflows/_ci-kernel.yml
    with:
      node-version: "22"
      run-lint: false
      run-typecheck: false
      run-build: true
      upload-artifact: true
      artifact-name: quality-gates-build
    secrets: inherit

  coverage:
    name: Unit test coverage (c8)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-bun
      - name: Run coverage
        run: bun run test:coverage 2>&1 | tee coverage.log
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage
            coverage.log
          retention-days: 14
          if-no-files-found: warn

  a11y:
    name: Accessibility (axe / Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-bun
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: quality-gates-build
          path: .
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Start preview
        run: bun run preview --port 8080 &
      - name: Wait for preview
        run: for i in {1..30}; do curl -sf http://localhost:8080/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Run axe accessibility spec
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: bunx playwright test tests/e2e/a11y --reporter=list 2>&1 | tee a11y.log
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report
            a11y.log
          retention-days: 14
          if-no-files-found: warn
