name: _CI Kernel (reusable)

# Reusable CI execution unit. Callers pass build inputs and this kernel runs
# lint / typecheck / build with the shared setup-node-bun action. Uploads
# the build output as an artifact so downstream jobs (deploy, lighthouse,
# SEO) can `download-artifact` instead of rebuilding.
#
# CALLER SHAPE:
#   jobs:
#     ci:
#       uses: ./.github/workflows/_ci-kernel.yml
#       with:
#         node-version: "22"
#         run-lint: true
#         run-typecheck: true
#         run-build: true
#         upload-artifact: true
#       secrets: inherit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "22"
      run-lint:
        type: boolean
        required: false
        default: true
      run-typecheck:
        type: boolean
        required: false
        default: true
      run-build:
        type: boolean
        required: false
        default: true
      upload-artifact:
        type: boolean
        required: false
        default: true
      artifact-name:
        type: string
        required: false
        default: "ci-build"
      build-command:
        type: string
        required: false
        default: "bun run build"
      build-target:
        description: "Passed as BUILD_TARGET env to the build step (e.g. 'node' for Nitro node-server preset)."
        type: string
        required: false
        default: ""
      # P4 shadow-mode routing hint. Callers (ci.yml matrix) pass
      # "core" | "seo" | "security". Default "core" preserves existing
      # behavior for every existing caller — no behavior change.
      mode:
        type: string
        required: false
        default: "core"

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        run: echo "CI kernel mode=${{ inputs.mode }}"



      - name: Setup toolchain
        uses: ./.github/actions/setup-node-bun
        with:
          node-version: ${{ inputs.node-version }}

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: bun run lint 2>&1 | tee lint.log

      - name: Typecheck
        if: ${{ inputs.run-typecheck && always() }}
        run: bun run typecheck 2>&1 | tee typecheck.log

      - name: Build
        if: ${{ inputs.run-build && always() }}
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          BUILD_TARGET: ${{ inputs.build-target }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: ${{ inputs.build-command }} 2>&1 | tee build.log

      - name: Artifact check
        if: ${{ inputs.run-build && always() }}
        run: |
          if [ ! -d dist ] && [ ! -d .output ]; then
            echo "::error::Build produced neither dist/ nor .output/"
            exit 1
          fi
          if [ "${{ inputs.build-target }}" = "node" ]; then
            if [ ! -f .output/server/index.mjs ]; then
              echo "::error::Node build target selected but .output/server/index.mjs is missing"
              exit 1
            fi
            SIZE=$(wc -c < .output/server/index.mjs | tr -d ' ')
            if [ "$SIZE" -lt "1024" ]; then
              echo "::error::.output/server/index.mjs is present but suspiciously small (${SIZE} bytes) — Nitro build likely failed"
              exit 1
            fi
            echo "Node server bundle OK: $(ls -la .output/server/index.mjs) (${SIZE} bytes)"
          fi

      - name: Generate artifact manifest
        if: ${{ inputs.run-build && inputs.build-target == 'node' && always() }}
        run: |
          MANIFEST=".output/manifest.json"
          {
            echo "{"
            echo "  \"generatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"gitSha\": \"${GITHUB_SHA}\","
            echo "  \"gitRef\": \"${GITHUB_REF}\","
            echo "  \"runId\": \"${GITHUB_RUN_ID}\","
            echo "  \"buildTarget\": \"${{ inputs.build-target }}\","
            echo "  \"nodeVersion\": \"$(node -v)\","
            echo "  \"serverEntry\": {"
            echo "    \"path\": \".output/server/index.mjs\","
            echo "    \"exists\": $( [ -f .output/server/index.mjs ] && echo true || echo false ),"
            echo "    \"sizeBytes\": $( [ -f .output/server/index.mjs ] && wc -c < .output/server/index.mjs | tr -d ' ' || echo 0 ),"
            echo "    \"sha256\": \"$( [ -f .output/server/index.mjs ] && sha256sum .output/server/index.mjs | cut -d' ' -f1 || echo missing )\""
            echo "  },"
            echo "  \"publicAssets\": $( [ -d .output/public ] && find .output/public -type f | wc -l | tr -d ' ' || echo 0 ),"
            echo "  \"totalFiles\": $(find .output -type f | wc -l | tr -d ' ')"
            echo "}"
          } > "$MANIFEST"
          echo "::notice::Artifact manifest:"
          cat "$MANIFEST"
          # Hard gate — abort if server entry missing or empty
          if [ ! -s .output/server/index.mjs ]; then
            echo "::error::Manifest check failed — .output/server/index.mjs missing or empty"
            exit 1
          fi


      - name: Upload build artifact
        if: ${{ inputs.upload-artifact && inputs.run-build && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          # TanStack Start + Nitro emits `.output/` (server + public). We
          # keep `dist` as a fallback for callers that still produce it.
          # Passenger release also needs app.js + package manifests +
          # scripts/ (predeploy validation, smoke tests) at release root.
          path: |
            .output
            dist
            app.js
            package.json
            package-lock.json
            bun.lock
            scripts
          # actions/upload-artifact v4 excludes dot-prefixed paths by default.
          # Nitro's complete Node server bundle lives under `.output/`, so this
          # must be enabled or the uploaded artifact silently omits index.mjs.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-logs
          path: |
            lint.log
            typecheck.log
            build.log
          retention-days: 14
          if-no-files-found: warn
